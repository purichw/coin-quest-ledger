<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Quest Ledger — Admin Portal</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f4f1ea; --panel:#fffdf8; --line:#ddd6c8; --ink:#26231f; --muted:#777168; --accent:#2f8f5b; --warn:#bd7b18; --danger:#c64b3c; --soft:#efe9dc; --gold:#c79a2e; --split:#2f8f5b; --debt:#c64b3c; --admin:#7a5cc9; --user:#2c7fa3; --char:#bd7b18; --font:"IBM Plex Sans Thai",system-ui,sans-serif; --display:"Mitr",system-ui,sans-serif; --mono:"Chakra Petch",monospace; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); }
    button,input,select { font-family:inherit; }
    button { cursor:pointer; }
    .shell { max-width:1440px; margin:0 auto; padding:24px; }
    .top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0; font-family:var(--display); font-size:30px; }
    .sub { color:var(--muted); font-size:14px; }
    .badge { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:999px; padding:4px 10px; background:var(--panel); color:var(--muted); font-size:12px; font-weight:700; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn { border:1.5px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); padding:9px 13px; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:white; }
    .btn.warn { color:var(--warn); }
    .btn.danger { color:var(--danger); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns:minmax(0,270px) minmax(0,1fr); gap:16px; align-items:start; }
    .side,.panel { min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:0 10px 30px -24px rgba(0,0,0,.3); }
    .nav { display:grid; gap:8px; }
    .nav button { text-align:left; border:0; background:transparent; border-radius:8px; padding:10px 12px; font-weight:700; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .nav button.on { background:var(--soft); color:var(--ink); }
    .stats { display:grid; gap:8px; margin-top:16px; }
    .stat { border-top:1px solid var(--line); padding-top:8px; color:var(--muted); font-size:13px; }
    .stat strong { color:var(--ink); font-family:var(--mono); font-size:20px; display:block; }
    .toolbar { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    .toolbar h2 { margin:0; font-family:var(--display); font-size:22px; }
    .search { min-width:220px; flex:1; max-width:420px; border:1.5px solid var(--line); border-radius:8px; padding:9px 11px; background:white; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { border-bottom:1px solid var(--line); padding:8px 7px; text-align:left; vertical-align:top; }
    th { color:var(--muted); font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.7px; }
    .field { width:100%; min-width:120px; border:1px solid var(--line); border-radius:7px; padding:7px 8px; background:white; }
    .small { max-width:110px; }
    .muted { color:var(--muted); }
    .pill { display:inline-block; border-radius:999px; background:var(--soft); padding:2px 8px; font-size:12px; font-weight:700; }
    .id-chip { border:1.5px solid var(--line); border-radius:999px; background:var(--panel); padding:3px 9px; display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink); margin:2px; text-decoration:none; }
    .id-chip.board { border-color:color-mix(in oklab,var(--split),white 45%); background:color-mix(in oklab,var(--split),white 88%); }
    .id-chip.admin { border-color:color-mix(in oklab,var(--admin),white 45%); background:color-mix(in oklab,var(--admin),white 88%); }
    .id-chip.user { border-color:color-mix(in oklab,var(--user),white 45%); background:color-mix(in oklab,var(--user),white 88%); }
    .id-chip.char { border-color:color-mix(in oklab,var(--char),white 45%); background:color-mix(in oklab,var(--char),white 88%); }
    .id-chip.debt { border-color:color-mix(in oklab,var(--debt),white 45%); background:color-mix(in oklab,var(--debt),white 90%); }
    .stat-grid { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:14px; }
    .stat-card { border:1px solid var(--line); border-radius:12px; background:linear-gradient(#fffdf8,#f7f1e6); padding:14px; min-height:104px; }
    .stat-card span { color:var(--muted); font-weight:700; font-size:12px; }
    .stat-card strong { display:block; margin-top:5px; font-family:var(--mono); font-size:28px; color:var(--ink); }
    .stat-card small { display:block; color:var(--muted); margin-top:5px; }
    .split-layout { display:grid; grid-template-columns:1.1fr .9fr; gap:14px; align-items:start; }
    .mini-list { display:grid; gap:8px; }
    .mini-row { border:1px solid var(--line); border-radius:10px; padding:10px; background:white; display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; background:var(--soft); padding:3px; gap:3px; }
    .seg button { border:0; background:transparent; border-radius:999px; padding:6px 10px; font-weight:800; color:var(--muted); }
    .seg button.on { background:var(--panel); color:var(--ink); box-shadow:0 2px 8px -6px rgba(0,0,0,.35); }
    .crumbs { display:flex; gap:7px; align-items:center; color:var(--muted); font-size:13px; margin-bottom:12px; flex-wrap:wrap; }
    .crumbs button { border:0; background:transparent; color:var(--accent); font-weight:800; padding:0; }
    .detail-grid { display:grid; grid-template-columns:minmax(280px,.8fr) 1.2fr; gap:14px; align-items:start; }
    .section { border:1px solid var(--line); border-radius:12px; background:white; padding:12px; margin-bottom:12px; }
    .section h3 { margin:0 0 10px; font-family:var(--display); font-size:18px; }
    .kv { display:grid; grid-template-columns:130px 1fr; gap:8px; padding:6px 0; border-bottom:1px dashed #e7decd; }
    .kv:last-child { border-bottom:0; }
    .kv b { color:var(--muted); font-size:12px; }
    .danger-zone { border-color:#efc3bc; background:#fff7f5; }
    .map { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; align-items:center; }
    .map-node { border:1px solid var(--line); border-radius:12px; background:white; padding:12px; min-height:92px; }
    .map-arrow { text-align:center; color:var(--gold); font-size:24px; font-weight:800; }
    .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .audit-filter { max-width:180px; }
    .rev { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:10px; background:white; }
    .rev summary { display:flex; justify-content:space-between; gap:12px; padding:12px; cursor:pointer; font-weight:700; }
    .rev-list { border-top:1px solid var(--line); padding:4px 12px 12px; }
    .change { display:grid; grid-template-columns:120px 1fr; gap:12px; padding:8px 0; border-bottom:1px solid #eee8dc; }
    .change:last-child { border-bottom:0; }
    .gate { max-width:420px; margin:12vh auto; }
    .gate .panel { display:grid; gap:12px; }
    .notice { border:1px solid #ead39e; background:#fff8df; color:#6d5415; border-radius:10px; padding:10px 12px; font-size:13px; }
    .modal-bg { position:fixed; inset:0 auto auto 0; width:100vw; height:100vh; display:none; align-items:center; justify-content:center; overflow:auto; background:rgba(0,0,0,.45); padding:20px; z-index:20; }
    .modal-bg.show { display:flex; }
    .modal { width:min(520px,100%); background:var(--panel); border-radius:14px; border:1px solid var(--line); padding:18px; box-shadow:0 22px 70px -20px rgba(0,0,0,.5); pointer-events:auto; }
    .modal h2 { margin:0 0 8px; font-family:var(--display); }
    .modal-input { margin-top:14px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
    @media (max-width: 980px) { .grid,.stat-grid,.split-layout,.detail-grid,.map { grid-template-columns:minmax(0,1fr); } .map-arrow { transform:rotate(90deg); } .panel { overflow-x:auto; } }
    @media (max-width: 800px) { .shell { padding:14px; overflow:hidden; } .grid { grid-template-columns:minmax(0,1fr); } .top { display:grid; } .panel { overflow-x:auto; } table { display:block; width:max-content; max-width:100%; overflow-x:auto; white-space:nowrap; } .actions { justify-content:flex-start; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root" class="modal-bg"></div>
  <script src="/shared/pointy-logic.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/admin/app.js"></script>
</body>
</html>
