  <style>
    :root {
      --font-display: "Mitr", system-ui, sans-serif;
      --font-body: "IBM Plex Sans Thai", system-ui, sans-serif;
      --font-stat: "Chakra Petch", monospace;
      --accent: #2f8f5b;
      --bg: #e7dcc6;
      --bg-glow: #f0e7d4;
      --panel: #fbf6ea;
      --panel-2: #f3e9d4;
      --panel-in: #fffdf7;
      --ink: #2f2515;
      --ink-soft: #87745a;
      --border: #ddc9a3;
      --border-strong: #c9ad7c;
      --gold: #c79320;
      --gold-soft: #efe0b6;
      --hp: #cf4633;
      --hp-bg: #e7d3c6;
      --xp: #d39a25;
      --shadow: 0 6px 22px -10px rgba(74,54,20,0.45);
      --topbar: #2b2113;
      --topbar-ink: #efe4cc;
    }
    [data-theme="tavern"] {
      --bg: #e7dcc6;
      --bg-glow: #f0e7d4;
      --panel: #fbf6ea;
      --panel-2: #f3e9d4;
      --panel-in: #fffdf7;
      --ink: #2f2515;
      --ink-soft: #87745a;
      --border: #ddc9a3;
      --border-strong: #c9ad7c;
      --gold: #c79320;
      --gold-soft: #efe0b6;
      --hp: #cf4633;
      --hp-bg: #e7d3c6;
      --xp: #d39a25;
      --shadow: 0 6px 22px -10px rgba(74,54,20,0.45);
      --topbar: #2b2113;
      --topbar-ink: #efe4cc;
    }
    [data-theme="dungeon"] {
      --bg: #14121f;
      --bg-glow: #221d36;
      --panel: #221d33;
      --panel-2: #2b2542;
      --panel-in: #1a1628;
      --ink: #ece8f8;
      --ink-soft: #a39bc4;
      --border: #3b3357;
      --border-strong: #4a4170;
      --gold: #ecc14e;
      --gold-soft: #3a3050;
      --hp: #ff5d70;
      --hp-bg: #3a2740;
      --xp: #ecc14e;
      --shadow: 0 10px 30px -12px rgba(0,0,0,0.7);
      --topbar: #0e0c17;
      --topbar-ink: #d9d2f0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(1100px 520px at 50% -10%, var(--bg-glow), transparent 72%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font-family: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
    .app-view[hidden] { display: none !important; }
    .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--topbar); color: var(--topbar-ink); padding: 12px 20px; border-radius: 12px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100; max-width: calc(100% - 32px); }
    .toast.show { opacity: 1; }
  </style>

<body data-page="home">
  <div class="first-load" data-first-load></div>

  <cq-player-header></cq-player-header>

  <main class="home app-view" id="home-view">
    <section class="home-hero">

        <div class="home-crest"><img src="/assets/home-reference/crest.webp" width="82" height="76" alt=""></div>
        <h1 class="home-hi">Coin Quest Ledger</h1>
        <p class="home-sub" id="home-sub"></p>
        <div class="home-renown" id="home-renown"></div>
      </div>
    </section>
    <div class="home-content">
      <section class="home-actions" id="home-actions" aria-label="Quick actions"></section>
      <section class="game-grid" id="home-grid" aria-label="Quest modules"></section>
      <cq-footer></cq-footer>
    </div>
  </main>

  <main class="page app-view" id="compare-view" hidden>
    <section class="arena-hero" id="arena-hero"></section>
    <section class="arena-content" aria-label="Price comparisons">
      <div class="arena-toolbar" id="arena-toolbar"></div>
      <div class="cmp-grid" id="cmp-grid"></div>
      <div id="cmp-empty" role="status"></div>
      <div id="arena-add"></div>
    </section>
    <cq-footer></cq-footer>
    <dialog id="arena-dialog" aria-labelledby="arena-dialog-title"></dialog>
  </main>
