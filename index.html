  <style>
    :root {
      --font-display: "Mitr", system-ui, sans-serif;
      --font-body: "IBM Plex Sans Thai", system-ui, sans-serif;
      --font-stat: "Chakra Petch", monospace;
      --accent: #2f8f5b;
      --bg: #e7dcc6;
      --bg-glow: #f0e7d4;
      --panel: #fbf6ea;
      --panel-2: #f3e9d4;
      --panel-in: #fffdf7;
      --ink: #2f2515;
      --ink-soft: #87745a;
      --border: #ddc9a3;
      --border-strong: #c9ad7c;
      --gold: #c79320;
      --gold-soft: #efe0b6;
      --hp: #cf4633;
      --hp-bg: #e7d3c6;
      --xp: #d39a25;
      --shadow: 0 6px 22px -10px rgba(74,54,20,0.45);
      --topbar: #2b2113;
      --topbar-ink: #efe4cc;
    }
    [data-theme="tavern"] {
      --bg: #e7dcc6;
      --bg-glow: #f0e7d4;
      --panel: #fbf6ea;
      --panel-2: #f3e9d4;
      --panel-in: #fffdf7;
      --ink: #2f2515;
      --ink-soft: #87745a;
      --border: #ddc9a3;
      --border-strong: #c9ad7c;
      --gold: #c79320;
      --gold-soft: #efe0b6;
      --hp: #cf4633;
      --hp-bg: #e7d3c6;
      --xp: #d39a25;
      --shadow: 0 6px 22px -10px rgba(74,54,20,0.45);
      --topbar: #2b2113;
      --topbar-ink: #efe4cc;
    }
    [data-theme="dungeon"] {
      --bg: #14121f;
      --bg-glow: #221d36;
      --panel: #221d33;
      --panel-2: #2b2542;
      --panel-in: #1a1628;
      --ink: #ece8f8;
      --ink-soft: #a39bc4;
      --border: #3b3357;
      --border-strong: #4a4170;
      --gold: #ecc14e;
      --gold-soft: #3a3050;
      --hp: #ff5d70;
      --hp-bg: #3a2740;
      --xp: #ecc14e;
      --shadow: 0 10px 30px -12px rgba(0,0,0,0.7);

      --topbar-ink: #d9d2f0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(1100px 520px at 50% -10%, var(--bg-glow), transparent 72%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font-family: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; transform: none; }
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--topbar); color: var(--topbar-ink); }
    .tb-inner { max-width: 980px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .tb-left { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .tb-logo { width: 28px; height: 28px; display: grid; place-items: center; flex-shrink: 0; border: 0; padding: 0; background: transparent; border-radius: 8px; }
    .tb-logo:hover { transform: translateY(-1px); }
    .tb-logo img { width: 28px; height: 28px; display: block; }
    .tb-nav { display: flex; gap: 6px; min-width: 0; }
    .tb-link { color: var(--topbar-ink); text-decoration: none; opacity: .62; font-size: 14px; padding: 7px 14px; border-radius: 9px; font-weight: 600; white-space: nowrap; }
    .tb-link.active { opacity: 1; background: rgba(255,255,255,.12); }
    .tb-back { display: none; align-items: center; gap: 8px; min-height: 36px; border: 0; border-radius: 11px; padding: 7px 16px; background: rgba(255,255,255,.12); color: var(--topbar-ink); font-size: 16px; font-weight: 700; }
    .tb-back.show { display: inline-flex; }
    .tb-wordmark { color: var(--topbar-ink); opacity: .86; font-family: var(--font-display); font-weight: 700; font-size: 16px; white-space: nowrap; }
    .lang-toggle { display: flex; background: rgba(255,255,255,.1); border-radius: 9px; padding: 3px; flex-shrink: 0; }
    .lang-toggle button { border: 0; background: transparent; color: var(--topbar-ink); opacity: .62; padding: 5px 11px; border-radius: 7px; font-family: var(--font-stat); font-weight: 700; font-size: 13px; }
    .lang-toggle button.lang-active { opacity: 1; background: var(--accent); color: #fff; }
    .app-view[hidden] { display: none !important; }
    .home { max-width: 980px; margin: 0 auto; padding: 34px 20px 62px; }
    .home-hero { text-align: center; padding: 22px 0 26px; }
    .home-crest { width: 74px; height: 74px; margin: 0 auto 12px; display: grid; place-items: center; border-radius: 20px; background: linear-gradient(160deg, var(--panel-in), var(--panel-2)); border: 1.5px solid var(--border-strong); box-shadow: var(--shadow); }
    .home-crest img { width: 48px; height: 48px; filter: drop-shadow(0 0 10px color-mix(in oklab, var(--gold), transparent 42%)) drop-shadow(0 4px 3px rgba(0,0,0,.34)); }
    .home-hi { margin: 0; color: var(--gold); font-family: var(--font-display); font-size: clamp(34px, 6vw, 56px); line-height: 1; font-weight: 800; letter-spacing: 0; text-shadow: 0 3px 18px color-mix(in oklab, var(--gold), transparent 62%); }
    .home-sub { margin: 12px auto 0; max-width: 520px; color: var(--ink-soft); font-size: 16px; line-height: 1.55; }
    .home-renown { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .hr-pill { display: inline-flex; align-items: center; min-height: 30px; padding: 4px 12px; border-radius: 999px; background: color-mix(in oklab, var(--panel), var(--panel-2) 22%); border: 1.5px solid var(--border); color: var(--ink); font-family: var(--font-stat); font-size: 12px; font-weight: 700; }
    .game-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .game-card { position: relative; min-height: 310px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; width: 100%; text-align: left; border: 1.5px solid color-mix(in oklab, var(--gc-accent), var(--border) 56%); border-radius: 18px; padding: 18px; background: linear-gradient(155deg, color-mix(in oklab, var(--gc-accent), var(--panel-in) 89%), var(--panel) 58%, var(--panel-2)); color: var(--ink); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.38); transition: transform .15s, border-color .15s, box-shadow .15s; overflow: hidden; }
    .game-card::after { content: ""; position: absolute; inset: auto -40px -64px auto; width: 170px; height: 170px; border-radius: 50%; background: color-mix(in oklab, var(--gc-accent), transparent 86%); pointer-events: none; }
    .game-card:hover { transform: translateY(-3px); border-color: var(--gc-accent); box-shadow: 0 14px 34px -20px var(--gc-accent), var(--shadow); }
    .gc-crest { width: 62px; height: 62px; display: grid; place-items: center; border-radius: 17px; border: 2px solid var(--gc-accent); background: color-mix(in oklab, var(--panel-in), var(--gc-accent) 8%); color: var(--gc-accent); box-shadow: 0 8px 20px -16px var(--gc-accent); font-size: 34px; }
    .gc-title { margin: 0; color: var(--ink); font-family: var(--font-display); font-size: 24px; line-height: 1.1; font-weight: 800; }
    .gc-desc { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.55; flex: 1; }
    .gc-meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .gc-chip { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 10px; border-radius: 999px; background: color-mix(in oklab, var(--gc-accent), transparent 88%); color: color-mix(in oklab, var(--gc-accent), var(--ink) 20%); font-family: var(--font-stat); font-size: 12px; font-weight: 800; }
    .gc-chip.alert { background: color-mix(in oklab, var(--hp), transparent 86%); color: var(--hp); }
    .gc-play { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 42px; border-radius: 12px; background: var(--gc-accent); color: #fff; font-family: var(--font-display); font-size: 16px; font-weight: 700; box-shadow: 0 3px 0 color-mix(in oklab, var(--gc-accent), #000 30%); }
    .foot { margin-top: 26px; text-align: center; color: var(--ink-soft); font-family: var(--font-stat); font-size: 12px; font-weight: 700; }
    .page { max-width: 980px; margin: 0 auto; padding: 26px 20px 60px; }
    .banner { text-align: center; padding: 8px 0 22px; }
    .banner-crest { font-size: 40px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.2)); }
    .banner-title { margin: 6px 0 10px; color: var(--accent); font-family: var(--font-display); font-size: 38px; font-weight: 700; letter-spacing: 0; }
    .banner-sub { max-width: 460px; margin: 6px auto 0; color: var(--ink-soft); font-size: 14px; line-height: 1.5; }
    .panel { background: var(--panel); border: 1.5px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .panel-title { margin: 0; color: var(--ink); font-family: var(--font-display); font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .count-pill { font-family: var(--font-stat); font-size: 13px; font-weight: 700; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 9px; }
    .cmp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .cmp-card { position: relative; background: linear-gradient(var(--panel-in), var(--panel-2)); border: 1.5px solid var(--border); border-radius: 16px; padding: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
    .cmp-head { position: relative; display: flex; align-items: center; gap: 11px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
    .cmp-icon { flex-shrink: 0; width: 48px; height: 48px; border-radius: 13px; background: radial-gradient(120% 120% at 50% 0%, var(--gold-soft), var(--panel)); border: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 2px 8px -4px var(--gold); }
    .cmp-id { flex: 1; min-width: 0; }
    .cmp-name { color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
    .cmp-unit { color: var(--ink-soft); font-family: var(--font-stat); font-size: 11px; }
    .cmp-save { display: flex; flex-direction: column; align-items: flex-end; background: color-mix(in oklab, var(--accent), transparent 86%); border-radius: 9px; padding: 4px 9px; }
    .cs-pct { color: var(--accent); font-family: var(--font-stat); font-weight: 700; font-size: 16px; line-height: 1; }
    .cs-lab { max-width: 74px; color: var(--ink-soft); font-size: 8px; font-weight: 600; text-align: right; }
    .card-del, .offer-del { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: var(--panel); color: var(--ink-soft); opacity: 0; z-index: 2; }
    .cmp-card:hover .card-del, .offer-row:hover .offer-del { opacity: 1; }
    .card-del:hover, .offer-del:hover { border-color: var(--hp); color: var(--hp); }
    .offer-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 11px; }
    .challengers-div { display: flex; align-items: center; gap: 8px; margin: 3px 2px 1px; }
    .challengers-div::before, .challengers-div::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .challengers-div span { color: var(--ink-soft); font-family: var(--font-stat); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .offer-row { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 12px; background: var(--panel); border: 1.5px solid var(--border); transition: .15s; }
    .offer-row.best { margin-top: 9px; padding-top: 16px; border-color: var(--gold); background: linear-gradient(118deg, var(--gold-soft), var(--panel) 70%); box-shadow: 0 0 0 1px var(--gold), 0 8px 22px -12px var(--gold); animation: champ-glow 2.8s ease-in-out infinite; }
    [data-theme="dungeon"] .offer-row.best { background: linear-gradient(118deg, color-mix(in oklab, var(--gold), var(--panel) 70%), var(--panel) 72%); }
    @keyframes champ-glow { 0%,100% { box-shadow: 0 0 0 1px var(--gold), 0 8px 22px -14px var(--gold); } 50% { box-shadow: 0 0 0 1px var(--gold), 0 8px 26px -8px var(--gold); } }
    .champion-ribbon { position: absolute; top: -10px; left: 11px; color: #2a1f05; background: linear-gradient(var(--gold), color-mix(in oklab, var(--gold), #000 16%)); border: 1px solid color-mix(in oklab, var(--gold), #000 28%); border-radius: 7px; padding: 2px 9px; box-shadow: 0 2px 6px -2px rgba(0,0,0,.4); font-family: var(--font-stat); font-weight: 700; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; }
    .of-rarity { flex-shrink: 0; width: 30px; text-align: center; font-size: 18px; }
    .of-main { flex: 1; min-width: 0; }
    .of-merchant { color: var(--ink); font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
    .of-detail { color: var(--ink-soft); font-family: var(--font-stat); font-size: 11px; margin-bottom: 5px; }
    .value-bar { height: 7px; border-radius: 5px; background: var(--panel-2); overflow: hidden; border: 1px solid rgba(0,0,0,.07); }
    .value-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--r-deep), var(--r-top)); transition: width .5s ease; }
    .offer-row.best .value-fill { background: linear-gradient(90deg, color-mix(in oklab, var(--gold), #000 12%), var(--gold)); }
    .of-right { flex-shrink: 0; text-align: right; }
    .of-pu { color: var(--ink); font-family: var(--font-stat); font-weight: 700; font-size: 16px; }
    .of-unit { color: var(--ink-soft); font-size: 10px; font-weight: 500; }
    .of-tag { margin-top: 1px; font-size: 10px; font-weight: 700; color: var(--r-text); }
    .best-tag { color: var(--r-text); }
    .offer-row.best .of-pu { color: color-mix(in oklab, var(--gold), #000 30%); }
    [data-theme="dungeon"] .offer-row.best .of-pu { color: var(--gold); }
    .offer-meta { color: var(--ink-soft); font-family: var(--font-stat); font-size: 10px; margin-top: 1px; }
    .of-save { color: color-mix(in oklab, var(--gold), #000 30%); font-family: var(--font-stat); font-size: 10px; font-weight: 700; margin-top: 1px; }
    [data-theme="dungeon"] .of-save { color: var(--gold); }
    [data-theme="dungeon"] .input,
    [data-theme="dungeon"] .num,
    [data-theme="dungeon"] .select {
      background: var(--panel-in);
      border-color: var(--border-strong);
    }
    .offer-builder { display: flex; flex-direction: column; gap: 8px; padding-top: 2px; }
    .draft-slot { position: relative; border: 1.5px solid var(--border); border-radius: 12px; background: color-mix(in oklab, var(--panel-in), var(--panel-2) 28%); overflow: hidden; }
    .draft-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-bottom: 1px solid color-mix(in oklab, var(--border), transparent 35%); color: var(--ink-soft); font-size: 11px; font-weight: 700; }
    .slot-num { font-family: var(--font-stat); color: var(--gold); }

    .draft-note { display: flex; min-width: 0; }

    .draft-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .required-hint { color: var(--ink-soft); font-size: 10px; font-weight: 700; }
    .btn-chip { min-height: 40px; border: 1.5px solid var(--border); background: color-mix(in oklab, var(--panel), transparent 16%); color: var(--ink-soft); border-radius: 999px; padding: 8px 11px; font-size: 11px; font-weight: 700; }
    .btn-chip:hover, .btn-chip.on { border-color: var(--border-strong); color: var(--ink); background: var(--panel); }
    .draft-extra { display: none; grid-template-columns: minmax(120px, 1fr) minmax(130px, 1fr); gap: 7px; padding: 0 9px 9px; }
    .draft-extra.show { display: grid; }
    .draft-slot.locked .draft-body, .draft-slot.locked .draft-extra { opacity: .32; pointer-events: none; }
    .mini-field { display: none; align-items: center; gap: 6px; min-width: 0; }
    .mini-field.show { display: flex; }
    .mini-label { color: var(--ink-soft); font-size: 10px; font-weight: 700; white-space: nowrap; }
    .promo-mini { display: none; align-items: center; gap: 6px; min-width: 0; }
    .promo-mini.show { display: flex; }
    .promo-mini .num { width: 58px; }
    .offer-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .offer-hint { color: var(--ink-soft); font-size: 11px; }
    .add-offer, .add-item-row { display: flex; align-items: center; gap: 7px; }
    .input, .num, .select { border: 1.5px solid var(--border-strong); border-radius: 10px; background: var(--panel-in); color: var(--ink); font-size: 13px; }
    .input { min-width: 0; padding: 8px 10px; flex: 1; }
    .select { min-width: 0; width: 100%; padding: 8px 9px; outline: 0; }
    .input:focus, .num input:focus, .select:focus { outline: 0; }
    .input:focus, .num:focus-within, .select:focus { border-color: var(--accent); }

    .icon-picker { position: relative; flex-shrink: 0; }

    .icon-opt:hover, .icon-opt.on { background: var(--panel-2); }

  <script src="/trip/pixicons.jsx"></script>
  <script>
    const STORE_KEY = 'pointy_compare_v2';
    const ITEM_ICONS = window.ITEM_ICON_IDS || window.ITEM_ICONS || ["🥛","🧴","🍚","🍫","☕","🧻","🥤","🍜","🔋","💊","🧃","🍞"];
    const UNIT_GROUPS = PointyLogic.UNIT_GROUPS;
    const BASE_UNITS = ['ml', 'g', 'm', 'ชิ้น'];
    const UNIT_ALIAS = PointyLogic.UNIT_ALIAS;
    const RARITY = {
      legendary: { th: "ในตำนาน", en: "Legendary", hue: 42, glyph: "👑" },
      epic: { th: "หายาก", en: "Epic", hue: 285, glyph: "💎" },
      rare: { th: "ดี", en: "Rare", hue: 235, glyph: "🔷" },
      common: { th: "ธรรมดา", en: "Common", hue: 30, glyph: "⚪" }
    };
    const MAX_DRAFT_OFFERS = 6;
    let comparisons = loadState();
    let draftSlots = {};
    let addOpen = false;
    let iconOpenFor = null;
    let itemIconDropUp = false;
    let itemIconMax = 430;
    let draftIcon = ITEM_ICONS[0];
    let toastTimer;
    let activeView = new URLSearchParams(location.search || '').get('view') === 'compare' ? 'compare' : 'home';

    const HOME_STR = {
      th: {
        back: 'หน้าหลัก',
        pick: 'เลือกเควสเพื่อเริ่มการผจญภัย',
        play: 'เล่น',
        foot: '⚔️ Coin Quest Ledger · หนึ่งแอป หลายเควส',
        splitTitle: 'แบ่งค่าใช้จ่าย',
        splitDesc: 'แบ่งค่าใช้จ่ายกับปาร์ตี้ — ใครจ่ายเท่าไหร่ เคลียร์ให้จบในเควสเดียว',
        debtTitle: 'มังกรหนี้',
        debtDesc: 'ปราบมังกรหนี้ทีละตัว — จ่ายคือโจมตี ดอกเบี้ยคือไฟที่มันพ่น',
        compareTitle: 'เปรียบเทียบราคา',
        compareDesc: 'ประลองราคาร้านค้าในสนามประลอง ของถูกที่สุดคว้าชัย',
        treasuryTitle: 'คลังหลวง',
        treasuryDesc: 'ตั้งงบรายเดือน ปกป้องคลังจากเหล่าสัตว์ร้ายที่มาปล้นทองทุกเดือน',
        quests: 'เควส',
        dragons: 'มังกร',
        deals: 'รายการ',
        wards: 'ด่าน',
        left: 'เหลือ',
        overdue: 'เลยกำหนด'
      },
      en: {
        back: 'Home',
        pick: 'Choose a quest to begin your adventure',
        play: 'Play',
        foot: '⚔️ Coin Quest Ledger · one app, many quests',
        splitTitle: 'Split Expenses',
        splitDesc: 'Split costs with your party — who paid what, settled up in one quest.',
        debtTitle: 'Debt Dragon',
        debtDesc: 'Slay your debt dragons one by one — payments strike, interest burns.',
        compareTitle: 'Compare Prices',
        compareDesc: 'Pit merchants against each other in the arena. Cheapest wins.',
        treasuryTitle: 'Personal Treasury',
        treasuryDesc: 'Set a monthly budget and keep the monsters that raid your gold in check.',
        quests: 'quests',
        dragons: 'dragons',
        deals: 'deals',
        wards: 'wards',
        left: 'left',
        overdue: 'overdue'
      }
    };

    function seed() {
      return [
        { id: uid(), name: "นมจืด UHT", icon: "🥛", baseUnit: "ml", offers: [
          { id: uid(), merchant: "ร้านสะดวกซื้อ", price: 18, qty: 180, unit: "ml", buy: 1, free: 0 },
          { id: uid(), merchant: "โลตัส", price: 42, qty: 1, unit: "l", buy: 1, free: 0 },
          { id: uid(), merchant: "บิ๊กซี", price: 59, qty: 1.5, unit: "l", buy: 1, free: 0 }
        ] },
        { id: uid(), name: "ผงซักฟอก", icon: "🧴", baseUnit: "g", offers: [
          { id: uid(), merchant: "ร้านใกล้บ้าน", price: 35, qty: 400, unit: "g", buy: 1, free: 0 },
          { id: uid(), merchant: "แม็คโคร", price: 175, qty: 3, unit: "kg", buy: 1, free: 0 }
        ] }
      ];
    }
    function uid() { return "x" + Math.random().toString(36).slice(2, 9); }
    function h(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function q(s) { return JSON.stringify(String(s ?? '')).replace(/"/g, '&quot;'); }
    function itemIconId(value) { return window.migrateItemIcon ? window.migrateItemIcon(value) : (value || ITEM_ICONS[0]); }
    function itemIconMarkup(value, size = 30, className = '') {
      const icon = itemIconId(value);
      return window.questIconSvg ? window.questIconSvg(icon, size, className) : h(icon);
    }
    function itemIconLabel(value) {
      const icon = itemIconId(value);
      return window.iconLabel ? window.iconLabel(icon, LANG || 'th') : '';
    }
    function homeCopy() { return HOME_STR[LANG === 'en' ? 'en' : 'th']; }
    function isTestMode() {
      try {
        return new URLSearchParams(location.search || '').get('test') === '1' || sessionStorage.getItem('pointy_test_mode_v1') === '1';
      } catch (_) {
        return false;
      }
    }
    function withTestParam(href) {
      if (!isTestMode()) return href;
      try {
        const url = new URL(href, location.origin);
        url.searchParams.set('test', '1');
        return url.pathname + url.search + url.hash;
      } catch (_) {
        return href;
      }
    }
    function readJson(key, fallback) {
      try {
        if (window.PointyScope) return window.PointyScope.getJSON(key, fallback);
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (_) {
        return fallback;
      }
    }
    function storageEntries(prefix, storage) {
      const out = [];
      try {
        for (let i = 0; i < storage.length; i += 1) {
          const key = storage.key(i);
          if (key && key.startsWith(prefix)) out.push({ key, data: JSON.parse(storage.getItem(key) || '{}') });
        }
      } catch (_) {}
      return out;
    }
    function tripCount() {
      const seen = new Set();
      storageEntries('pointy_test_trip_', sessionStorage).forEach(e => seen.add(e.key));
      if (!window.PointyScope?.accountKey?.()) {
        storageEntries('pointy_trip_', localStorage).forEach(e => seen.add(e.key));
      }
      const cache = readJson('coin_quest_trip_snapshots_v1', {});
      if (cache && typeof cache === 'object') Object.keys(cache).forEach(k => seen.add(k));
      return seen.size;
    }
    function debtStats() {
      const debt = readJson('pointy_debt_v5', {});
      const dragons = Array.isArray(debt.dragons) ? debt.dragons : [];
      const today = new Date();
      const overdue = dragons.filter(d => {
        if (d.slain || d.payMode === 'adhoc' || !d.dueDay) return false;
        return today.getDate() > Math.min(Number(d.dueDay) || 31, new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate());
      }).length;
      return { total: dragons.length, overdue };
    }
    function treasuryStats() {
      const tr = readJson('pointy_treasury_v1', {});
      const categories = Array.isArray(tr.categories) ? tr.categories : [];
      const expenses = Array.isArray(tr.expenses) ? tr.expenses : [];
      const spent = expenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
      const left = Math.max(0, (Number(tr.income) || 0) - spent);
      return { wards: categories.length, left };
    }
    function renderHome() {
      const hs = homeCopy();
      document.querySelector('[data-i18n="home_back"]').textContent = hs.back;
      document.getElementById('home-sub').textContent = hs.pick;
      document.getElementById('home-foot').textContent = hs.foot;
      const profile = window.PointyProfileHub?.computeProfile ? window.PointyProfileHub.computeProfile() : { level: { lvl: 1 } };
      const streak = readJson('pointy_profile_v1', {}).streak || 0;
      const debt = debtStats();
      const tr = treasuryStats();
      document.getElementById('home-renown').innerHTML = `
        <span class="hr-pill">⭐ LV ${profile.level?.lvl || 1}</span>
        <span class="hr-pill">🔥 ${streak} ${LANG === 'en' ? 'day streak' : 'วันติด'}</span>
        <span class="hr-pill">🏆 ${profile.renown || 0} ${LANG === 'en' ? 'Renown' : 'ชื่อเสียง'}</span>
      `;
      const cards = [
        { id: 'split', icon: '💰', title: hs.splitTitle, desc: hs.splitDesc, accent: '#2f8f5b', chips: [`${tripCount()} ${hs.quests}`], href: '/trip/' },
        { id: 'debt', icon: '🐉', title: hs.debtTitle, desc: hs.debtDesc, accent: '#cf4633', chips: [`${debt.total} ${hs.dragons}`, ...(debt.overdue ? [`${debt.overdue} ${hs.overdue}`] : [])], href: '/debt/' },
        { id: 'compare', icon: '⚖️', title: hs.compareTitle, desc: hs.compareDesc, accent: '#2a7fb8', chips: [`${comparisons.length} ${hs.deals}`], href: '/?view=compare' },
        { id: 'treasury', icon: '🏦', title: hs.treasuryTitle, desc: hs.treasuryDesc, accent: '#c79a2e', chips: [`${tr.wards} ${hs.wards}`, `${money(tr.left)} ${hs.left}`], href: '/treasury/' }
      ];
      document.getElementById('home-grid').innerHTML = cards.map(card => `
        <button class="game-card" type="button" style="--gc-accent:${card.accent}" data-home-card="${card.id}">
          <div class="gc-crest">${card.icon}</div>
          <h2 class="gc-title">${h(card.title)}</h2>
          <p class="gc-desc">${h(card.desc)}</p>
          <div class="gc-meta">${card.chips.map((chip, i) => `<span class="gc-chip ${i > 0 && card.id !== 'treasury' ? 'alert' : ''}">${h(chip)}</span>`).join('')}</div>
          <span class="gc-play">▶ ${h(hs.play)}</span>
        </button>
      `).join('');
      document.querySelectorAll('[data-home-card]').forEach(btn => {
        const card = cards.find(c => c.id === btn.dataset.homeCard);
        btn.addEventListener('click', () => {
          if (card.id === 'compare') openCompare();
          else location.href = withTestParam(card.href);
        });
      });
    }
    function updateView(push) {
      const compare = activeView === 'compare';
      document.getElementById('home-view').hidden = compare;
      document.getElementById('compare-view').hidden = !compare;
      document.getElementById('home-back').classList.toggle('show', compare);
      document.getElementById('home-wordmark').hidden = compare;
      document.title = compare ? 'Coin Quest Ledger — ' + t('cmp_title') : 'Coin Quest Ledger';
      if (compare) render();
      else renderHome();
      if (push) history.pushState({ view: activeView }, '', compare ? '/?view=compare' : '/');
    }
    function showHome() { activeView = 'home'; updateView(true); }
    function openCompare() { activeView = 'compare'; updateView(true); }
    function money(n) { return '฿' + (Number(n) || 0).toLocaleString(LANG === 'th' ? 'th-TH' : 'en-US'); }
    function approxEqual(a, b) { return PointyLogic.approxEqual(a, b); }
    function locale() { return LANG === 'th' ? 'th-TH' : 'en-US'; }
    function fmtQty(n) {
      return (Number(n) || 0).toLocaleString(locale(), { maximumFractionDigits: 4 });
    }
    function normalizeUnit(unit) { return PointyLogic.normalizeUnit(unit, UNIT_ALIAS); }
    function groupOf(unit) { return PointyLogic.groupOf(unit, UNIT_GROUPS, UNIT_ALIAS); }
    function groupForCmp(cmp) { return PointyLogic.groupForCmp(cmp, UNIT_GROUPS, UNIT_ALIAS); }
    function displayUnit(unit) {
      const u = normalizeUnit(unit);
      const th = { ml: 'มล.', l: 'ลิตร', kl: 'kl', mg: 'มก.', g: 'กรัม', kg: 'กก.', mm: 'มม.', cm: 'ซม.', m: 'เมตร', km: 'กม.', 'ชิ้น': 'ชิ้น', 'แพ็ค/กล่อง': 'แพ็ค/กล่อง' };
      const en = { ml: 'ml', l: 'l', kl: 'kl', mg: 'mg', g: 'g', kg: 'kg', mm: 'mm', cm: 'cm', m: 'm', km: 'km', 'ชิ้น': 'pcs', 'แพ็ค/กล่อง': 'pack/box' };
      return (LANG === 'th' ? th[u] : en[u]) || u;
    }
    function unitOptionsFor(cmp, selected) {
      const group = groupForCmp(cmp);
      return Object.keys(group.units).map(u => `<option value="${h(u)}" ${normalizeUnit(selected) === u ? 'selected' : ''}>${h(displayUnit(u))}</option>`).join('');
    }
    function optionLabel(offer) {
      const manual = String(offer.merchant || '').trim();
      if (manual) return manual;
      return `${fmtQty(offer.qty)} ${displayUnit(offer.unit)}`;
    }
    function baseUnitOptions(selected) {
      const key = u => u === 'ชิ้น' ? 'pcs' : u;
      return BASE_UNITS.map(u => `<option value="${h(u)}" ${normalizeUnit(selected) === u ? 'selected' : ''}>${h(t('base_unit_' + key(u)))}</option>`).join('');
    }
    function toggleItemIconPicker(ev) {
      const willOpen = iconOpenFor !== 'new';
      if (willOpen && ev?.currentTarget) {
        const rect = ev.currentTarget.getBoundingClientRect();
        const below = window.innerHeight - rect.bottom - 24;
        const above = rect.top - 24;
        itemIconDropUp = below < 320 && above > below;
        itemIconMax = Math.max(260, Math.min(430, itemIconDropUp ? above : below));
      }
      iconOpenFor = willOpen ? 'new' : null;
      render();
    }
    function normalizeComparison(cmp) {
      const normalized = PointyLogic.normalizeComparison(cmp, {
        idFactory: uid,
        itemFallback: t('item'),
        merchantFallback: t('merchant'),
        unitGroups: UNIT_GROUPS,
        unitAlias: UNIT_ALIAS
      });
      return { ...normalized, icon: itemIconId(normalized.icon) };
    }
    function loadState() {
      try {
        const raw = window.PointyScope
          ? JSON.stringify(window.PointyScope.getJSON(STORE_KEY, null))
          : localStorage.getItem(STORE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (Array.isArray(data)) return data.map(normalizeComparison);
        }
      } catch (e) {}
      return seed().map(normalizeComparison);
    }
    function saveState() {
      try {
        if (window.PointyScope) window.PointyScope.setJSON(STORE_KEY, comparisons);
        else localStorage.setItem(STORE_KEY, JSON.stringify(comparisons));
      } catch (e) {}
      window.dispatchEvent(new CustomEvent('coin-quest-state-changed'));
    }
    function normalizedOffer(offer, cmp) { return PointyLogic.normalizedOffer(offer, cmp, { unitGroups: UNIT_GROUPS, unitAlias: UNIT_ALIAS }); }
    function perUnit(o, cmp) { return normalizedOffer(o, cmp).pu; }
    function rankOffers(offers, cmp) { return PointyLogic.rankOffers(offers, cmp, { unitGroups: UNIT_GROUPS, unitAlias: UNIT_ALIAS }); }
    function fmtUnit(pu) {
      if (!isFinite(pu)) return "—";
      if (pu < 0.1) return "฿" + pu.toFixed(3);
      if (pu < 10) return "฿" + pu.toFixed(2);
      return "฿" + Math.round(pu).toLocaleString(LANG === 'th' ? 'th-TH' : 'en-US');
    }
    function rarityStyle(hue) {
      return `--r-top:oklch(0.74 0.15 ${hue});--r-deep:oklch(0.5 0.16 ${hue});--r-soft:oklch(0.93 0.05 ${hue});--r-text:oklch(0.45 0.16 ${hue})`;
    }
    function render() {
      document.getElementById('cmp-count').textContent = comparisons.length;
      const grid = document.getElementById('cmp-grid');
      grid.innerHTML = comparisons.map(renderCard).join('') + renderAddCard();
      document.getElementById('cmp-empty').innerHTML = comparisons.length ? '' : `<div class="empty">🔍 ${t('no_items')}</div>`;
      translatePage();
    }
    function renderAll() { activeView === 'compare' ? render() : renderHome(); }
    function renderCard(cmp) {
      const ranked = rankOffers(cmp.offers || [], cmp);
      const best = ranked.find(o => o.isBest);
      const enough = ranked.length >= 2;
      const bestPu = best && isFinite(best.pu) ? best.pu : Math.min(...ranked.map(o => o.pu).filter(Number.isFinite));
      return `<div class="cmp-card">
        <div class="cmp-head">
          <span class="cmp-icon">${itemIconMarkup(cmp.icon || ITEM_ICONS[0], 32)}</span>
          <div class="cmp-id"><div class="cmp-name">${h(cmp.name)}</div><div class="cmp-unit">${t('per_unit')} ${h(displayUnit(cmp.baseUnit))}</div></div>
          ${enough && best && best.savePct > 0 ? `<div class="cmp-save"><span class="cs-pct">−${best.savePct}%</span><span class="cs-lab">${t('cheaper_by')}</span></div>` : ''}
          <button class="card-del" onclick="deleteComparison(${q(cmp.id)})">×</button>
        </div>
        ${ranked.length ? `<div class="offer-list">${ranked.map((o, idx) => `${idx === 1 && enough ? `<div class="challengers-div"><span>CHALLENGERS</span></div>` : ''}${renderOffer(cmp, o, enough, bestPu)}`).join('')}</div>` : `<div class="empty">${t('no_offers')}</div>`}
        ${renderOfferBuilder(cmp)}
      </div>`;
    }
    function renderOffer(cmp, offer, enough, bestPu) {
      const r = RARITY[offer.tier];
      const norm = offer.norm || normalizedOffer(offer, cmp);
      const pack = normalizeUnit(offer.unit) === 'แพ็ค/กล่อง' && offer.perPack ? ` · ${t('pack_short', { n: fmtQty(offer.perPack) })}` : '';
      const promo = offer.free > 0 ? ` · ${t('promo_label', { buy: offer.buy || 1, free: offer.free })}` : '';
      const normalized = norm.valid && (!approxEqual(norm.qty, offer.qty) || normalizeUnit(offer.unit) !== norm.baseUnit || offer.free > 0)
        ? `<div class="offer-meta">${t('normalized_to', { qty: fmtQty(norm.qty), unit: displayUnit(norm.baseUnit) })}${pack}${promo}</div>` : '';
      const tag = offer.isEqual ? `<div class="of-tag">${t('badge_equal')}</div>`
        : enough && offer.isBest && offer.savePct > 0 ? `<div class="of-save">⚔ ${LANG === 'th' ? 'ประหยัด' : 'rescues'} −${offer.savePct}%</div>`
        : enough && offer.isBest ? `<div class="of-tag best-tag">👑 ${t('best_deal')}</div>`
        : `<div class="of-tag">${h(r[LANG] || r.th)}</div>`;
      const width = offer.isBest ? 100 : (isFinite(bestPu) && bestPu > 0 && isFinite(offer.pu) && offer.pu > 0 ? Math.max(24, Math.min(94, Math.round((bestPu / offer.pu) * 100))) : 44);
      return `<div class="offer-row ${offer.isBest ? 'best' : ''}" style="${rarityStyle(r.hue)}">
        ${offer.isBest ? `<div class="champion-ribbon">👑 CHAMPION</div>` : ''}
        <div class="of-rarity" title="${h(r[LANG] || r.th)}">${r.glyph}</div>
        <div class="of-main"><div class="of-merchant">${h(offer.merchant || t('merchant'))}</div><div class="of-detail">${money(offer.price)} · ${fmtQty(offer.qty)} ${h(displayUnit(offer.unit))}</div><div class="value-bar"><div class="value-fill" style="width:${width}%"></div></div>${normalized}</div>
        <div class="of-right"><div class="of-pu">${fmtUnit(offer.pu)}<span class="of-unit">/${h(displayUnit(norm.baseUnit))}</span></div>${tag}</div>
        <button class="offer-del" onclick="deleteOffer(${q(cmp.id)},${q(offer.id)})">×</button>
      </div>`;
    }
    function defaultDraft(cmp) {
      return { id: uid(), merchant: '', price: '', qty: '', unit: groupForCmp(cmp).base, perPack: '', buy: '1', free: '0' };
    }
    function ensureDrafts(cid) {
      const cmp = comparisons.find(c => c.id === cid);
      if (!cmp) return [];
      if (!draftSlots[cid]) draftSlots[cid] = [defaultDraft(cmp), defaultDraft(cmp)];
      while (draftSlots[cid].length < 2) draftSlots[cid].push(defaultDraft(cmp));
      return draftSlots[cid];
    }
    function draftComplete(draft, cmp) {
      if (!draft) return false;
      const price = parseFloat(draft.price);
      const qty = parseFloat(draft.qty);
      if (!(price > 0) || !(qty > 0)) return false;
      if (normalizeUnit(draft.unit) === 'แพ็ค/กล่อง') {
        const perPack = parseFloat(draft.perPack);
        if (!(perPack > 0)) return false;
      }
      return normalizedOffer({ ...draft, price, qty }, cmp).valid;
    }
    function renderOfferBuilder(cmp) {
      const slots = ensureDrafts(cmp.id);
      let unlocked = true;
      const rows = slots.map((slot, i) => {
        const locked = !unlocked;
        unlocked = unlocked && draftComplete(slot, cmp);
        return renderDraftSlot(cmp, slot, i, locked);
      }).join('');
      const completeCount = slots.filter(s => draftComplete(s, cmp)).length;
      const canAdd = slots.length < MAX_DRAFT_OFFERS && draftComplete(slots[slots.length - 1], cmp);
      return `<div class="offer-builder" id="builder-${cmp.id}">
        ${rows}
        <div class="offer-actions">
          <span class="offer-hint">${t('offer_count', { n: (cmp.offers || []).length })}</span>
          <span>
            ${slots.length > 2 ? `<button class="btn-ghost" onclick="deleteDraftSlot(${q(cmp.id)})">${t('remove_offer_slot')}</button>` : ''}
            <button class="btn-ghost" onclick="addDraftSlot(${q(cmp.id)})" ${canAdd ? '' : 'disabled'}>${t('add_offer_slot')}</button>
            <button class="btn-primary" onclick="saveDraftOffers(${q(cmp.id)})" ${completeCount ? '' : 'disabled'}>${t('save_offers')}</button>
          </span>
        </div>
      </div>`;
    }
    function renderDraftSlot(cmp, slot, i, locked) {
      const packOpen = normalizeUnit(slot.unit) === 'แพ็ค/กล่อง';
      const advancedOpen = !!slot.advanced || packOpen;
      return `<div class="draft-slot ${locked ? 'locked' : ''}" id="slot-${cmp.id}-${i}">
        <div class="draft-head"><span class="slot-num">${t('offer_slot', { n: i + 1 })}</span>${locked ? `<span class="slot-lock">${t('lock_prev_offer')}</span>` : ''}</div>
        <div class="draft-body">
          <div class="draft-note">
            <input class="input" value="${h(slot.merchant)}" placeholder="${h(t('option_note_ph'))}" oninput="updateDraft(${q(cmp.id)},${i},'merchant',this.value)">
          </div>
          <div class="calc-row">
            <span class="num"><span>฿</span><input value="${h(slot.price)}" type="number" inputmode="decimal" placeholder="${h(t('price'))}" oninput="updateDraft(${q(cmp.id)},${i},'price',this.value)"></span>
            <span class="num"><input value="${h(slot.qty)}" type="number" inputmode="decimal" placeholder="${h(t('qty'))}" oninput="updateDraft(${q(cmp.id)},${i},'qty',this.value)"></span>
            <select class="select" onchange="updateDraft(${q(cmp.id)},${i},'unit',this.value)">${unitOptionsFor(cmp, slot.unit)}</select>
          </div>
          <div class="draft-tools">
            <span class="required-hint">${t('required_price_qty')}</span>
            <button class="btn-chip ${advancedOpen ? 'on' : ''}" onclick="toggleAdvanced(${q(cmp.id)},${i})">${advancedOpen ? t('hide_advanced') : t('show_advanced')}</button>
          </div>
        </div>
        <div class="draft-extra ${advancedOpen ? 'show' : ''}" id="extra-${cmp.id}-${i}">
          <div class="mini-field ${packOpen ? 'show' : ''}" id="pack-${cmp.id}-${i}">
            <span class="mini-label">${t('field_per_pack')}</span>
            <span class="num"><input value="${h(slot.perPack)}" type="number" inputmode="decimal" placeholder="${h(t('placeholder_per_pack'))}" oninput="updateDraft(${q(cmp.id)},${i},'perPack',this.value)"></span>
          </div>
          <div class="promo-mini ${slot.advanced ? 'show' : ''}">
            <span class="mini-label">${t('field_promo')}</span>
            <span class="num"><input value="${h(slot.buy || 1)}" type="number" inputmode="numeric" min="1" step="1" oninput="updateDraft(${q(cmp.id)},${i},'buy',this.value)"></span>
            <span class="mini-label">${t('promo_sep')}</span>
            <span class="num"><input value="${h(slot.free || 0)}" type="number" inputmode="numeric" min="0" step="1" oninput="updateDraft(${q(cmp.id)},${i},'free',this.value)"></span>
          </div>
        </div>
      </div>`;
    }
    function renderAddCard() {
      if (!addOpen) return `<button class="add-cmp" onclick="addOpen=true;render()"><span style="font-size:26px;line-height:1">＋</span><span>${t('add_item')}</span></button>`;
      return `<div class="cmp-card add-cmp-open">
        <div class="add-item-row">
          <div class="icon-picker ${itemIconDropUp ? 'drop-up' : ''}" style="--icon-pop-max:${itemIconMax}px"><button class="icon-btn" onclick="toggleItemIconPicker(event)" aria-label="${h(itemIconLabel(draftIcon) || t('item'))}">${itemIconMarkup(draftIcon, 34)}</button>${iconOpenFor === 'new' ? `<div class="icon-pop labeled">${ITEM_ICONS.map(ic => `<button class="icon-opt ${itemIconId(draftIcon) === itemIconId(ic) ? 'on' : ''}" onclick="draftIcon=${q(itemIconId(ic))};iconOpenFor=null;render()" title="${h(itemIconLabel(ic))}">${itemIconMarkup(ic, 36)}<span class="io-lab">${h(itemIconLabel(ic))}</span></button>`).join('')}</div>` : ''}</div>
          <input class="input" id="new-name" placeholder="${h(t('item_name_ph'))}" onkeydown="if(event.key==='Enter')addComparison()">
        </div>
        <div class="add-item-row">
          <select class="select" id="new-unit">${baseUnitOptions('ml')}</select>
          <button class="btn-ghost" onclick="addOpen=false;render()">✕</button>
          <button class="btn-primary" onclick="addComparison()">${t('add_item')}</button>
        </div>
      </div>`;
    }
    function addComparison() {
      const name = document.getElementById('new-name')?.value.trim();
      const unit = normalizeUnit(document.getElementById('new-unit')?.value);
      if (!name) { toast(t('err_desc')); return; }
      const group = groupOf(unit) || UNIT_GROUPS[0];
      comparisons.unshift({ id: uid(), name, baseUnit: group.base, icon: itemIconId(draftIcon), offers: [] });
      addOpen = false; draftIcon = ITEM_ICONS[0]; saveState(); render();
    }
    function deleteComparison(id) {
      comparisons = comparisons.filter(c => c.id !== id);
      saveState(); render();
    }
    function deleteOffer(cid, oid) {
      comparisons = comparisons.map(c => c.id === cid ? { ...c, offers: c.offers.filter(o => o.id !== oid) } : c);
      saveState(); render();
    }
    function updateDraft(cid, idx, field, value) {
      const cmp = comparisons.find(c => c.id === cid);
      if (!cmp) return;
      const slots = ensureDrafts(cid);
      slots[idx][field] = value;
      if (field === 'unit') {
        const pack = document.getElementById(`pack-${cid}-${idx}`);
        if (pack) pack.classList.toggle('show', normalizeUnit(value) === 'แพ็ค/กล่อง');
        const extra = document.getElementById(`extra-${cid}-${idx}`);
        if (extra) extra.classList.toggle('show', normalizeUnit(value) === 'แพ็ค/กล่อง' || !!slots[idx].advanced);
      }
      updateDraftState(cid);
    }
    function toggleAdvanced(cid, idx) {
      const slots = ensureDrafts(cid);
      if (!slots[idx]) return;
      slots[idx].advanced = !slots[idx].advanced;
      render();
    }
    function updateDraftState(cid) {
      const cmp = comparisons.find(c => c.id === cid);
      if (!cmp) return;
      const slots = ensureDrafts(cid);
      let unlocked = true;
      slots.forEach((slot, i) => {
        const el = document.getElementById(`slot-${cid}-${i}`);
        if (el) el.classList.toggle('locked', !unlocked);
        unlocked = unlocked && draftComplete(slot, cmp);
      });
      const builder = document.getElementById(`builder-${cid}`);
      if (!builder) return;
      const buttons = builder.querySelectorAll('.offer-actions button');
      const completeCount = slots.filter(s => draftComplete(s, cmp)).length;
      if (buttons.length) {
        const addBtn = Array.from(buttons).find(btn => btn.textContent === t('add_offer_slot'));
        const saveBtn = Array.from(buttons).find(btn => btn.textContent === t('save_offers'));
        if (addBtn) addBtn.disabled = !(slots.length < MAX_DRAFT_OFFERS && draftComplete(slots[slots.length - 1], cmp));
        if (saveBtn) saveBtn.disabled = completeCount < 1;
      }
    }
    function addDraftSlot(cid) {
      const cmp = comparisons.find(c => c.id === cid);
      const slots = ensureDrafts(cid);
      if (!cmp || slots.length >= MAX_DRAFT_OFFERS) { toast(t('max_offers')); return; }
      if (!draftComplete(slots[slots.length - 1], cmp)) { toast(t('err_offer_incomplete')); return; }
      slots.push(defaultDraft(cmp));
      render();
    }
    function deleteDraftSlot(cid) {
      const slots = ensureDrafts(cid);
      if (slots.length <= 2) return;
      slots.pop();
      render();
    }
    function saveDraftOffers(cid) {
      const cmp = comparisons.find(c => c.id === cid);
      const slots = ensureDrafts(cid);
      if (!cmp) return;
      const complete = slots.filter(s => draftComplete(s, cmp));
      if (!complete.length) { toast(t('err_no_complete_offer')); return; }
      const offers = complete.map(s => ({
        id: uid(),
        merchant: String(s.merchant || '').trim(),
        price: parseFloat(s.price),
        qty: parseFloat(s.qty),
        unit: normalizeUnit(s.unit),
        perPack: parseFloat(s.perPack) || 0,
        buy: Math.max(1, parseInt(s.buy, 10) || 1),
        free: Math.max(0, parseInt(s.free, 10) || 0)
      })).map(o => ({ ...o, merchant: optionLabel(o) }));
      comparisons = comparisons.map(c => c.id === cid ? { ...c, offers: [...(c.offers || []), ...offers] } : c);
      draftSlots[cid] = [defaultDraft(cmp), defaultDraft(cmp)];
      saveState(); render(); toast(t('offers_saved', { n: offers.length }));
    }
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    window.addEventListener('popstate', () => {
      activeView = new URLSearchParams(location.search || '').get('view') === 'compare' ? 'compare' : 'home';
      updateView(false);
    });
    translatePage();
    updateView(false);
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/shared/firebase-client.js"></script>
  <script src="/shared/profile-session.js"></script>
  <script src="/shared/profile-auth.js"></script>
  <script src="/shared/profile-recovery.js"></script>
  <script src="/shared/profile-tour.js"></script>
  <script src="/shared/profile-hub.js"></script>
  <script src="/shared/mobile-shell.js"></script>
  <script>setTimeout(function(){ if (typeof renderAll === 'function') renderAll(); }, 0);</script>
</body>
