name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: npm test

      - name: Run isolated Firebase integration tests
        run: npm run test:backend

  native-contracts:
    name: Native contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # Native QA scripts share the repository's Firebase emulator/Admin tools.
      - name: Install repository QA dependencies
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Check native source and contracts
        run: |
          npm run typecheck
          npm run lint
          node --test tests/*.test.mjs
          npm run test:qa
          npm run test:device
          sh -n scripts/build-device.sh scripts/install-device.sh

  deploy-production:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [ci, native-contracts]
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel token
        id: vercel-token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::warning::VERCEL_TOKEN is not set; skipping production deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.vercel-token.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.vercel-token.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.vercel-token.outputs.enabled == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.vercel-token.outputs.enabled == 'true'
        run: npm install --global vercel@54.18.4

      - name: Pull Vercel environment
        if: steps.vercel-token.outputs.enabled == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production
        if: steps.vercel-token.outputs.enabled == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        if: steps.vercel-token.outputs.enabled == 'true'
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "$deployment_url"

      - name: Update canonical alias
        if: steps.vercel-token.outputs.enabled == 'true'
        run: vercel alias set "${{ steps.deploy.outputs.url }}" coinquestledger.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
