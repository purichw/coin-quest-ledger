    :root {

    .dc-del { position: absolute; top: 9px; right: 9px; z-index: 4; width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--border-strong); background: var(--panel); color: var(--ink-soft); opacity: 0; }

    .dragon-medallion.face .dragon-png { object-position: center 46%; }

    .dragon-ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: rgba(255,255,255,.78); cursor: pointer; }
