<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debt Dragon — design review</title>
<style>body{margin:0;background:#eee7d8;color:#30251a;font:16px/1.5 system-ui,sans-serif}header{padding:24px 28px;background:#fbf6ea;border-bottom:1px solid #d8c5a5}h1{font-size:26px;margin:0 0 8px}p{margin:6px 0;max-width:1000px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,a{color:inherit}button{font:inherit;padding:10px 20px;border:1px solid #b69d73;border-radius:7px;background:#fffaf0;cursor:pointer}button[aria-pressed=true]{background:#226e50;color:white;border-color:#226e50}main{padding:18px;max-width:1500px;margin:auto}img{display:block;width:100%;height:auto;border-radius:8px}figure{margin:0 0 26px}figcaption{padding:12px 2px}section[hidden]{display:none}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pair img{width:100%}@media(max-width:700px){header{padding:18px}.pair{grid-template-columns:1fr}}</style>
<header><h1>Debt Dragon — หน้ารวมเกม</h1><p>ปรับจาก mockup เฉพาะพื้นที่เกม ใช้ยอดหนี้จริงในข้อมูลทดสอบและเมนูส่วนกลางเดิม ภาพด้านล่างมาจากเว็บไซต์ในเครื่อง ยังไม่ได้ deploy</p><nav><button data-view="desktop" aria-pressed="true">Desktop</button><button data-view="tablet" aria-pressed="false">Tablet</button><button data-view="mobile" aria-pressed="false">Mobile</button><button data-view="before" aria-pressed="false">Before / After</button></nav></header>
<main><section data-panel="desktop"><figure><img src="comparison-desktop.jpg" alt="Mockup เทียบกับหน้ารวม Debt Dragon ที่พัฒนาแล้ว"><figcaption>เทียบพื้นที่เกมด้วยความกว้างเท่ากัน — ข้อมูลตัวอย่างใน mockup ต่างจากข้อมูลจริงของ fixture</figcaption></figure><a href="qa/dark-en-1440.png">ดู Dungeon / English</a></section>
<section data-panel="tablet" hidden><div class="pair"><figure><img src="reference-tablet.png" alt="Tablet reference"><figcaption>Reference — เฉพาะเกม</figcaption></figure><figure><img src="qa/after-768.png" alt="Current tablet at 768px"><figcaption>Implementation 768px พร้อมเมนูเดิม</figcaption></figure></div></section>
<section data-panel="mobile" hidden><img src="comparison-mobile.jpg" alt="Mobile reference เทียบกับภาพส่วนบนและส่วนล่างของเว็บไซต์"><p><a href="qa/after-390.png">ภาพเต็มหน้า 390px</a> · <a href="qa/dark-en-390.png">Dungeon / English</a> · <a href="qa/paid-mobile.png">จ่ายหนี้ครบแล้ว</a></p></section>
<section data-panel="before" hidden><div class="pair"><figure><img src="qa/before-1440.png" alt="Actual before"><figcaption>Before — ภาพที่บันทึกก่อนแก้</figcaption></figure><figure><img src="qa/after-1440.png" alt="Actual after"><figcaption>After — ข้อมูลและ viewport เดียวกัน</figcaption></figure></div></section></main>
<script>document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==button.dataset.view)}));</script></html>
