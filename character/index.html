<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Quest Ledger — Character Profile</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/first-load.css">
  <style>
    :root { --bg:#efe9dc; --panel:#fffdf8; --ink:#29241d; --muted:#7a6f60; --line:#d8c8a9; --accent:#2f8f5b; --gold:#c79a2e; --danger:#bd3f32; --soft:#f6f0e4; --font:"IBM Plex Sans Thai",system-ui,sans-serif; --display:"Mitr",system-ui,sans-serif; --mono:"Chakra Petch",monospace; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:var(--font); background:linear-gradient(180deg,#2b2014 0 92px,var(--bg) 92px); }
    button,input { font-family:inherit; }
    button { cursor:pointer; }
    .shell { width:min(1180px,100%); margin:0 auto; padding:24px; }
    .top { display:flex; justify-content:space-between; gap:16px; align-items:center; min-height:68px; color:#fff8e8; }
    .brand { display:flex; gap:10px; align-items:center; font-family:var(--display); font-size:22px; font-weight:700; }
    .top-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn { border:1.5px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); padding:9px 12px; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:7px; }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:white; }
    .btn.ghost { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.22); color:#fff8e8; }
    .hero { margin-top:14px; display:grid; grid-template-columns:330px 1fr; gap:18px; align-items:stretch; }
    .portrait-card,.panel { background:var(--panel); border:1.5px solid var(--line); border-radius:14px; box-shadow:0 18px 45px -32px rgba(0,0,0,.45); }
    .portrait-card { overflow:hidden; display:grid; grid-template-rows:340px auto; }
    .portrait-stage { position:relative; background:var(--avatar-bg); overflow:hidden; }
    .portrait-stage img { position:absolute; left:0; right:0; bottom:-1%; margin:auto; height:104%; width:auto; object-fit:contain; filter:drop-shadow(0 10px 10px rgba(0,0,0,.34)); animation:idle-sway 2.9s ease-in-out infinite; transform-origin:50% 100%; }
    @keyframes idle-sway { 0%,100% { transform:rotate(-.5deg); } 50% { transform:rotate(.6deg) scaleY(1.006); } }
    .portrait-info { padding:16px; display:grid; gap:8px; }
    .char-id { display:inline-flex; width:max-content; font-family:var(--mono); border:1px solid var(--line); background:var(--soft); border-radius:999px; padding:4px 10px; font-weight:700; color:var(--muted); }
    h1 { margin:0; font-family:var(--display); font-size:34px; line-height:1.05; }
    h2 { margin:0; font-family:var(--display); font-size:22px; }
    .sub,.muted { color:var(--muted); }
    .hero-main { display:grid; gap:14px; }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .stat { border:1px solid var(--line); background:linear-gradient(180deg,#fffaf0,#f7f0e2); border-radius:10px; padding:12px; min-height:82px; }
    .stat span { display:block; color:var(--muted); font-size:12px; font-weight:700; }
    .stat strong { display:block; margin-top:4px; font-family:var(--mono); font-size:24px; }
    .xp-panel { padding:16px; }
    .xp-row { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .bar { height:14px; border-radius:999px; overflow:hidden; background:#eadfc9; border:1px solid var(--line); margin-top:10px; }
    .fill { display:block; height:100%; width:var(--pct); background:linear-gradient(90deg,var(--accent),var(--gold)); }
    .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:18px; margin-top:18px; align-items:start; }
    .panel { padding:16px; }
    .panel-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    .money-hidden .money { user-select:none; }
    .badges { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
    .badge { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:10px; background:var(--soft); padding:10px; }
    .badge-icon { font-size:22px; }
    .board-list { display:grid; gap:10px; }
    .board { display:grid; grid-template-columns:1fr auto; gap:10px; border:1px solid var(--line); border-radius:10px; padding:12px; background:white; }
    .board-title { font-weight:800; }
    .board-meta { color:var(--muted); font-size:13px; margin-top:4px; }
    .board-money { text-align:right; font-family:var(--mono); font-weight:700; }
    .pos { color:var(--accent); }
    .neg { color:var(--danger); }
    .search-card { margin-top:18px; padding:18px; display:grid; gap:12px; }
    .search-row { display:flex; gap:8px; flex-wrap:wrap; }
    .search-row input { flex:1; min-width:180px; border:1.5px solid var(--line); border-radius:8px; padding:10px 12px; font-family:var(--mono); font-size:18px; }
    .empty { padding:30px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:12px; background:rgba(255,255,255,.45); }
    @media (max-width: 860px) { .shell { padding:14px; } .hero,.grid { grid-template-columns:1fr; } .summary { grid-template-columns:repeat(2,1fr); } .portrait-card { grid-template-rows:300px auto; } .top { align-items:flex-start; } }
    @media (max-width: 520px) { .top { display:grid; } .top-actions { justify-content:flex-start; } .summary { grid-template-columns:1fr; } .board { grid-template-columns:1fr; } .board-money { text-align:left; } h1 { font-size:28px; } }
  </style>
</head>
<body>
  <div class="first-load" data-first-load>
    <div class="first-load-box">
      <img class="first-load-mark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E" data-asset-src="assets/icons/loot-chest.svg" alt="">
      <div class="first-load-title">Coin Quest Ledger</div>
      <div class="first-load-track"><div class="first-load-fill"></div></div>
    </div>
  </div>
  <div id="app"></div>
  <script src="/shared/pointy-logic.js"></script>
  <script src="/shared/cloudinary-assets.js"></script>
  <script src="/shared/asset-urls.js"></script>
  <script src="/shared/first-load.js"></script>
  <script src="/lang.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/character/app.js"></script>
</body>
</html>
