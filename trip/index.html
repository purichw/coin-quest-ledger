  <style>
    :root {

    * { box-sizing: border-box; }
    html, body { margin: 0; }

    .debt-val.pos { color: var(--accent); }
    .debt-val.neg { color: var(--hp); }
    .settled { text-align: center; padding: 28px 16px; }
    .settled .emoji { font-size: 40px; }
    .settled .title { color: var(--accent); font-family: var(--font-display); font-size: 20px; font-weight: 600; margin-top: 8px; }
    .settled .sub { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
    .qr-paybox { display: grid; place-items: center; gap: 12px; padding: 14px; border: 1.5px solid var(--border); border-radius: 15px; background: var(--panel-in); }
    .qr-svg { width: min(280px, 72vw); height: auto; border: 8px solid #fff; border-radius: 10px; background: #fff; box-shadow: var(--shadow); }
    .tribute-summary { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; color: var(--ink); font-weight: 700; flex-wrap: wrap; }
    .pp-form { display: grid; gap: 9px; }
    .board-grid { display: grid; gap: 10px; }
    .board-card { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px; border: 1.5px solid var(--border); border-radius: 13px; background: var(--panel-in); }
    .board-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent), transparent 82%); }
    .board-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
    .board-meta { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
    .board-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }

    .lightbox-img { max-width: min(86vw, 860px); max-height: 78vh; border-radius: 14px; border: 1.5px solid var(--border-strong); box-shadow: 0 24px 60px -20px rgba(0,0,0,.7); background: var(--panel); }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--topbar); color: var(--topbar-ink); padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .2s; z-index: 50; font-weight: 600; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .hidden { display: none !important; }
    @keyframes legend-glow {
      0%,100% { box-shadow: 0 0 0 2px color-mix(in oklab, var(--gold), #fff 20%), 0 0 14px 0 color-mix(in oklab, var(--gold), transparent 55%); }
      50% { box-shadow: 0 0 0 2px color-mix(in oklab, var(--gold), #fff 35%), 0 0 24px 4px color-mix(in oklab, var(--gold), transparent 30%); }
    }
    @keyframes lub-flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes lub-pop { 0% { transform: scale(.4); opacity: 0; } 25% { transform: scale(1.15); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { opacity: 0; } }
    @keyframes lub-fly { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-16px,-20px) scale(1.1); opacity: 0; } }
    @keyframes lub-fly2 { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(16px,-18px) scale(1.1); opacity: 0; } }
    @keyframes lub-fly3 { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-14px,18px) scale(1.1); opacity: 0; } }
    @keyframes lub-fly4 { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(16px,16px) scale(1.1); opacity: 0; } }
    @keyframes vc-rise { from { transform: scale(.9) translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes cf-fall { to { transform: translateY(105vh) rotate(540deg); } }
    @media (max-width: 1024px) {
      .page { max-width: 880px; padding-left: 16px; padding-right: 16px; }
      .qf-top { flex-wrap: wrap; }

      .confirm-actions button { width: 100%; }
      .qf-top { flex-wrap: wrap; }
      .loot-row { grid-template-columns: 1fr; }
      .quest-row, .tribute { align-items: flex-start; }
      .tribute { flex-wrap: wrap; }
      .board-card { grid-template-columns: 1fr; }
      .quick-amount input { font-size: 46px; }
      .split-seg { width: 100%; overflow-x: auto; }
      .split-seg button { flex: 1; white-space: nowrap; }
      .settings-fab { right: 12px; bottom: 12px; }
      .quick-toggles { right: 10px; top: 58px; flex-direction: row; }
      .quick-toggle { width: 44px; height: 44px; border-radius: 12px; }
      .vc-recap { flex-wrap: wrap; }
    }
    @media (max-width: 600px) {
      .hero-remove,
      .qr-del,
      .offer-del {
        opacity: .92;
      }
      .hero-remove,
      .hc-skin {
        width: 34px;
        height: 34px;
      }
      .hc-skin {
        left: 43px;
        bottom: 8px;
      }
      .skin-pop {
        top: 48px;
        bottom: 8px;
        z-index: 10;
        overflow-y: auto;
      }
      .portrait-img,
      .skin-thumb img {
        pointer-events: none;
      }
      .skin-opt {
        scroll-margin-top: 90px;
      }
      .qr-del,
      .offer-del {
        top: -7px;
        right: -7px;
      }
      .quest-row {
        padding-right: 32px;
      }
      .btn-ghost.xs,
      .btn-ghost.sm,
      .btn-primary.sm,
      .mini-toggle {
        min-height: 40px;
      }
      .hero-chip {
        padding: 9px 15px 9px 9px;
      }
      .mini-toggle {
        padding: 7px 12px;
      }
      #save-status {
        grid-column: 1 / -1;
        min-height: 20px;
      }
      .camp-name {
        min-height: 42px;
      }
      .split-seg button {
        min-height: 34px;
        padding: 6px 10px;
      }

    }
    @media (hover: none) and (pointer: coarse) and (min-width: 601px) {
      .theme-toggle,

      .btn-primary,
      .btn-gold,

        min-width: 44px;
      }

        cursor: default;
      }
    }

    </section>
