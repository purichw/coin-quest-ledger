<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Ledger — แบ่งค่าใช้จ่าย</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: "Mitr", system-ui, sans-serif;
      --font-body: "IBM Plex Sans Thai", system-ui, sans-serif;
      --font-stat: "Chakra Petch", monospace;
      --accent: #2f8f5b;
      --bg: #e7dcc6;
      --bg-glow: #f0e7d4;
      --panel: #fbf6ea;
      --panel-2: #f3e9d4;
      --panel-in: #fffdf7;
      --ink: #2f2515;
      --ink-soft: #87745a;
      --border: #ddc9a3;
      --border-strong: #c9ad7c;
      --gold: #c79320;
      --gold-soft: #efe0b6;
      --hp: #cf4633;
      --hp-bg: #e7d3c6;
      --xp: #d39a25;
      --shadow: 0 6px 22px -10px rgba(74,54,20,0.45);
      --topbar: #2b2113;
      --topbar-ink: #efe4cc;
    }
    [data-theme="dungeon"] {
      --bg: #14121f;
      --bg-glow: #221d36;
      --panel: #221d33;
      --panel-2: #2b2542;
      --panel-in: #1a1628;
      --ink: #ece8f8;
      --ink-soft: #a39bc4;
      --border: #3b3357;
      --border-strong: #4a4170;
      --gold: #ecc14e;
      --gold-soft: #3a3050;
      --hp: #ff5d70;
      --hp-bg: #3a2740;
      --xp: #ecc14e;
      --shadow: 0 10px 30px -12px rgba(0,0,0,0.7);
      --topbar: #0e0c17;
      --topbar-ink: #d9d2f0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(1100px 520px at 50% -10%, var(--bg-glow), transparent 72%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    body.no-animations *, body.no-animations *::before, body.no-animations *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
    button, input, select { font-family: inherit; }
    button { cursor: pointer; }
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--topbar); color: var(--topbar-ink); }
    .tb-inner { max-width: 980px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .tb-left { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .tb-logo { width: 28px; height: 28px; display: grid; place-items: center; flex-shrink: 0; }
    .tb-logo img { width: 28px; height: 28px; }
    .tb-nav { display: flex; gap: 6px; min-width: 0; }
    .tb-link { color: var(--topbar-ink); text-decoration: none; opacity: .62; font-size: 14px; padding: 7px 14px; border-radius: 9px; font-weight: 600; white-space: nowrap; }
    .tb-link.active { opacity: 1; background: rgba(255,255,255,.12); }
    .lang-toggle { display: flex; background: rgba(255,255,255,.1); border-radius: 9px; padding: 3px; flex-shrink: 0; }
    .lang-toggle button { border: 0; background: transparent; color: var(--topbar-ink); opacity: .62; padding: 5px 11px; border-radius: 7px; font-family: var(--font-stat); font-weight: 700; font-size: 13px; }
    .lang-toggle button.lang-active { opacity: 1; background: var(--accent); color: #fff; }
    .page { max-width: 980px; margin: 0 auto; padding: 26px 20px 60px; }
    .banner { text-align: center; padding: 8px 0 22px; }
    .banner-crest { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,.2)); }
    .banner-crest img { width: 46px; height: 46px; }
    .banner-title { margin: 6px 0 10px; font-family: var(--font-display); font-size: 38px; font-weight: 700; color: var(--accent); letter-spacing: 0; }
    .campaign-row { display: inline-flex; align-items: center; justify-content: center; gap: 9px; flex-wrap: wrap; }
    .camp-label { font-family: var(--font-stat); font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-soft); }
    .camp-name { border: 0; background: transparent; color: var(--ink); font-family: var(--font-display); font-size: 18px; font-weight: 500; border-radius: 7px; padding: 2px 6px; }
    .camp-name:hover { background: var(--panel-2); }
    .camp-edit { display: none; border: 2px solid var(--accent); border-radius: 8px; background: var(--panel-in); color: var(--ink); padding: 3px 8px; text-align: center; font-family: var(--font-display); font-size: 18px; }
    .banner-gold { display: inline-flex; align-items: center; gap: 9px; margin: 16px auto 4px; padding: 8px 18px; border-radius: 999px; background: linear-gradient(var(--panel), var(--panel-2)); border: 1.5px solid var(--border-strong); box-shadow: var(--shadow); }
    .loot-logo { display: block; filter: drop-shadow(0 0 5px color-mix(in oklab, var(--gold), transparent 45%)) drop-shadow(0 2px 2px rgba(0,0,0,.4)); transition: transform .15s ease; }
    .loot-logo:hover { transform: translateY(-1px) scale(1.06) rotate(-3deg); }
    .bg-coin { width: 30px; height: 30px; flex: 0 0 auto; }
    .bg-amt { font-family: var(--font-stat); font-size: 22px; font-weight: 700; color: var(--gold); }
    .bg-lab { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
    .banner-actions { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    #save-status { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
    #save-status.error { color: var(--hp); }
    .btn-primary, .btn-gold, .btn-ghost, .btn-tool, .seg button, .chip-all, .icon-btn, .icon-opt {
      border: 0; border-radius: 11px; font-weight: 600; transition: transform .08s, box-shadow .08s, background .14s, border-color .14s;
    }
    .btn-primary { background: var(--accent); color: #fff; padding: 11px 18px; font-size: 14px; box-shadow: 0 3px 0 color-mix(in oklab, var(--accent), #000 28%); }
    .btn-primary:active, .btn-gold:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in oklab, var(--accent), #000 28%); }
    .btn-primary.big { width: 100%; padding: 14px; font-family: var(--font-display); font-size: 16px; margin-top: 4px; }
    .btn-primary.sm { padding: 8px 13px; font-size: 13px; box-shadow: 0 2px 0 color-mix(in oklab, var(--accent), #000 28%); }
    .btn-gold { background: linear-gradient(var(--gold), color-mix(in oklab, var(--gold), #000 14%)); color: #2a1f06; padding: 10px 16px; font-size: 14px; box-shadow: 0 3px 0 color-mix(in oklab, var(--gold), #000 35%); }
    .btn-ghost, .btn-tool { border: 1.5px solid var(--border-strong); background: var(--panel); color: var(--ink); padding: 10px 15px; font-size: 14px; }
    .btn-ghost:hover, .btn-tool:hover { background: var(--panel-2); }
    .btn-ghost.xs { padding: 6px 11px; font-size: 12px; border-radius: 9px; }
    .btn-ghost.danger:hover { border-color: var(--hp); color: var(--hp); }
    .panel { background: var(--panel); border: 1.5px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .panel-title { margin: 0; color: var(--ink); font-family: var(--font-display); font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .count-pill { font-family: var(--font-stat); font-size: 13px; font-weight: 700; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 9px; }
    .party-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .hero-card { position: relative; background: linear-gradient(var(--panel-in), var(--panel-2)); border: 1.5px solid var(--border); border-radius: 16px; padding: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); overflow: hidden; }
    .hero-card.guardian { border-color: color-mix(in oklab, var(--accent), var(--border) 30%); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 1px color-mix(in oklab, var(--accent), transparent 60%), 0 8px 24px -14px var(--accent); }
    .hero-card.debt { border-color: color-mix(in oklab, var(--hp), var(--border) 45%); }
    .hero-remove { position: absolute; top: 7px; right: 7px; z-index: 3; width: 24px; height: 24px; border: 0; border-radius: 8px; color: #fff; background: rgba(0,0,0,.3); opacity: 0; }
    .hero-card:hover .hero-remove { opacity: .88; }
    .hero-remove:hover { background: var(--hp); }
    .portrait { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 13px; margin-bottom: 10px; overflow: hidden; border: 2px solid var(--frame, var(--border)); background: var(--avatar-bg, radial-gradient(125% 92% at 50% 16%, color-mix(in oklab, var(--cc-top), #12100c 18%), color-mix(in oklab, var(--cc-bot), #111 38%) 78%)); display: flex; align-items: flex-end; justify-content: center; }
    .portrait.gold { box-shadow: 0 0 12px -3px var(--gold), inset 0 0 0 1px color-mix(in oklab, var(--gold), #000 28%); }
    .portrait.legend { animation: legend-glow 2.6s ease-in-out infinite; }
    .portrait-img { position: absolute; left: 0; right: 0; bottom: -1%; margin: 0 auto; width: auto; height: 102%; max-width: none; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 5px 5px rgba(0,0,0,.35)); }
    .portrait-fallback { font-size: clamp(44px, 10vw, 74px); filter: drop-shadow(0 2px 2px rgba(0,0,0,.28)); margin: auto; }
    .class-badge, .lvl-badge, .status-badge { position: absolute; z-index: 2; display: flex; align-items: center; justify-content: center; }
    .class-badge { left: 7px; top: 7px; width: 30px; height: 30px; border-radius: 9px; background: rgba(0,0,0,.4); color: #fff; backdrop-filter: blur(3px); }
    .lvl-badge { right: 7px; top: 7px; flex-direction: column; min-width: 44px; border-radius: 10px; padding: 2px 8px; background: linear-gradient(var(--gold), color-mix(in oklab, var(--gold), #000 16%)); border: 1.5px solid color-mix(in oklab, var(--gold), #000 25%); color: #2a1f05; }
    .lvl-badge span:first-child { font-family: var(--font-stat); font-size: 8px; letter-spacing: 1px; font-weight: 700; }
    .lvl-badge span:last-child { font-family: var(--font-stat); font-size: 19px; font-weight: 700; line-height: 1; }
    .status-badge { right: 7px; bottom: 7px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; background: var(--panel-2); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
    .status-badge.guardian { background: color-mix(in oklab, var(--accent), #fff 12%); }
    .status-badge.debt { background: color-mix(in oklab, var(--hp), #fff 8%); }
    .status-badge.even { border-color: var(--border-strong); }
    .hc-skin { position: absolute; left: 41px; bottom: 7px; z-index: 3; width: 28px; height: 28px; border: 0; border-radius: 9px; background: linear-gradient(var(--gold), color-mix(in oklab, var(--gold), #000 22%)); color: #2a1d04; font-size: 14px; line-height: 1; box-shadow: 0 1px 3px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4); transition: transform .12s, box-shadow .12s; }
    .hc-skin:hover, .hc-skin.on { transform: translateY(-1px); box-shadow: 0 0 0 2px var(--gold-soft), 0 2px 6px rgba(0,0,0,.35); }
    .skin-pop { position: absolute; left: 7px; right: 7px; bottom: 41px; z-index: 5; padding: 9px; border: 1.5px solid var(--border-strong); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); animation: pk-fade .14s ease-out; }
    .skin-pop-h { margin: 0 2px 7px; color: var(--gold); font-family: var(--font-stat); font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
    .skin-pop-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .skin-opt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; padding: 5px 4px 6px; border: 1.5px solid var(--border); border-radius: 9px; background: var(--panel-in); color: var(--ink); transition: transform .12s, border-color .12s, box-shadow .12s; }
    .skin-opt:hover { transform: translateY(-1px); border-color: var(--border-strong); }
    .skin-opt.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold-soft); }
    .skin-thumb { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 7px; overflow: hidden; background: var(--avatar-bg); }
    .skin-thumb img { position: absolute; left: 0; right: 0; bottom: -1%; width: auto; height: 102%; max-width: none; margin: 0 auto; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
    .skin-name { width: 100%; overflow: hidden; color: var(--ink); font-size: 10.5px; font-weight: 600; line-height: 1.15; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .skin-check { position: absolute; top: 3px; right: 5px; color: var(--gold); font-size: 11px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .hero-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.15; }
    .hero-class-row { display: flex; align-items: center; gap: 7px; margin-top: 4px; flex-wrap: wrap; }
    .hero-class { font-size: 12px; color: var(--ink-soft); }
    .rank-pill { font-family: var(--font-stat); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--ink-soft); }
    .rank-bronze { color: #8a5e2c; background: color-mix(in oklab, #c08a4a, transparent 80%); }
    .rank-silver { color: #5d6b80; background: color-mix(in oklab, #aab4c4, transparent 74%); }
    .rank-gold { color: var(--gold); background: var(--gold-soft); }
    .rank-legend { color: #fff; background: linear-gradient(90deg, var(--gold), #e6a626); }
    .bars { margin: 11px 0 10px; display: flex; flex-direction: column; gap: 7px; }
    .bar-row { display: flex; align-items: center; gap: 8px; }
    .bar-lab { width: 22px; font-family: var(--font-stat); font-size: 10px; font-weight: 700; }
    .bar-lab.hp { color: var(--hp); }
    .bar-lab.xp { color: var(--xp); }
    .bar { flex: 1; height: 10px; border-radius: 6px; background: var(--hp-bg); overflow: hidden; border: 1px solid rgba(0,0,0,.08); }
    .bar-fill { height: 100%; border-radius: 6px; transition: width .45s ease; }
    .xp-bar { background: var(--gold-soft); }
    .xp-bar .bar-fill { background: linear-gradient(var(--xp), color-mix(in oklab, var(--xp), #000 18%)); }
    .bar-val, .budget-edit { font-family: var(--font-stat); font-size: 10px; color: var(--ink-soft); min-width: 50px; text-align: right; }
    .budget-btn { border: 0; background: transparent; color: var(--ink-soft); border-radius: 5px; padding: 1px 3px; }
    .budget-btn:hover { background: var(--panel-2); color: var(--ink); }
    .budget-btn .over { color: var(--hp); font-weight: 700; }
    .budget-edit { width: 68px; border: 1.5px solid var(--gold); border-radius: 6px; padding: 2px 5px; background: var(--panel-in); color: var(--ink); }
    .hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 9px; margin-top: 10px; border-top: 1px solid var(--border); }
    .mini-stat { display: flex; flex-direction: column; }
    .mini-stat span:first-child { font-size: 10px; color: var(--ink-soft); font-weight: 600; }
    .mini-stat span:last-child { font-family: var(--font-stat); font-size: 15px; font-weight: 700; }
    .status-chip { display: flex; align-items: center; gap: 6px; border-radius: 10px; padding: 4px 9px 4px 7px; }
    .status-chip.guardian { background: color-mix(in oklab, var(--accent), transparent 86%); color: var(--accent); }
    .status-chip.debt { background: var(--hp-bg); color: var(--hp); }
    .status-chip.even { background: var(--panel-2); color: var(--ink-soft); }
    .status-chip strong { display: block; font-size: 10px; letter-spacing: .2px; }
    .status-chip span:last-child { font-family: var(--font-stat); color: var(--ink); font-size: 13px; font-weight: 700; }
    .levelup { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; background: radial-gradient(circle, color-mix(in oklab, var(--gold), transparent 30%), transparent 70%); animation: lub-flash 1.6s ease-out forwards; }
    .levelup strong { color: #fff; font-family: var(--font-display); font-size: 19px; text-shadow: 0 2px 8px rgba(0,0,0,.5); animation: lub-pop 1.6s ease-out forwards; }
    .lub-star { position: absolute; color: #fff; font-size: 20px; text-shadow: 0 0 8px var(--gold); }
    .lub-star.s1 { top: 18%; left: 22%; animation: lub-fly 1.6s ease-out forwards; }
    .lub-star.s2 { top: 26%; right: 18%; animation: lub-fly2 1.6s ease-out forwards; }
    .lub-star.s3 { bottom: 24%; left: 26%; animation: lub-fly3 1.6s ease-out forwards; }
    .lub-star.s4 { right: 24%; bottom: 20%; animation: lub-fly4 1.6s ease-out forwards; }
    .add-hero { border: 2px dashed var(--border-strong); background: transparent; color: var(--ink-soft); border-radius: 16px; min-height: 132px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
    .add-hero:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent), transparent 93%); }
    .add-hero-form { display: grid; grid-column: span 2; gap: 10px; }
    .hero-builder { display: grid; grid-template-columns: minmax(104px, .8fr) minmax(0, 1fr); gap: 10px; align-items: stretch; }
    .avatar-preview { position: relative; min-height: 168px; border: 2px solid var(--ring); border-radius: 14px; background: radial-gradient(125% 92% at 50% 16%, color-mix(in oklab, var(--top), #12100c 18%), color-mix(in oklab, var(--bot), #111 38%) 78%); overflow: hidden; }
    .avatar-preview img { position: absolute; left: 0; right: 0; bottom: -1%; margin: 0 auto; width: auto; height: 102%; max-width: none; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 5px 5px rgba(0,0,0,.35)); }
    .avatar-preview .class-badge { left: 8px; top: 8px; }
    .avatar-preview .portrait-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 52px; }
    .avatar-preview-label { position: absolute; z-index: 2; left: 8px; right: 8px; bottom: 7px; padding: 4px 7px; border-radius: 8px; background: rgba(0,0,0,.48); color: #fff; text-align: center; font-size: 11px; font-weight: 700; backdrop-filter: blur(3px); }
    .avatar-preview.empty { display: flex; align-items: center; justify-content: center; border-style: dashed; background: var(--panel-2); color: var(--ink-soft); }
    .avatar-empty { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 18px; text-align: center; font-size: 12px; font-weight: 600; }
    .avatar-empty span:first-child { font-size: 34px; line-height: 1; opacity: .65; }
    .class-tools { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .gender-toggle { display: flex; background: var(--panel-2); border-radius: 10px; padding: 3px; width: max-content; }
    .gender-btn { width: 36px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-soft); font-size: 16px; font-weight: 800; }
    .gender-btn.on { background: var(--accent); color: #fff; }
    .choose-hero-btn { width: 100%; border: 1.5px solid var(--border-strong); border-radius: 11px; background: var(--panel); color: var(--ink); padding: 10px 12px; font-weight: 700; }
    .choose-hero-btn:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent), transparent 93%); }
    .lock-note { color: var(--ink-soft); font-size: 10px; line-height: 1.4; }
    .btn-primary:disabled { cursor: not-allowed; opacity: .45; box-shadow: none; transform: none; }
    .picker-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(20,14,8,.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: pk-fade .15s ease-out; }
    .picker { width: min(560px, 96vw); max-height: 90vh; overflow: auto; background: var(--panel); border: 1.5px solid var(--border-strong); border-radius: 20px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.6); padding: 20px; animation: pk-pop .18s ease-out; }
    .picker-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
    .picker-title { color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 20px; }
    .picker-sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
    .picker-close { width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--border-strong); background: var(--panel-in); color: var(--ink-soft); font-size: 16px; flex-shrink: 0; }
    .picker-close:hover { color: var(--hp); border-color: var(--hp); }
    .picker-filter { display: flex; gap: 6px; margin-bottom: 14px; background: var(--panel-2); padding: 4px; border-radius: 11px; }
    .picker-filter button { flex: 1; border: 0; background: transparent; color: var(--ink-soft); font-size: 13px; font-weight: 600; padding: 7px 10px; border-radius: 8px; }

    .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }

    function fileToScaledDataURL(file, maxDim, cb) {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
          const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          try { cb(cv.toDataURL("image/jpeg", 0.82)); } catch (e) { cb(reader.result); }
        };
        img.onerror = () => cb(reader.result);
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

          <td><div class="admin-actions"><button class="btn-ghost xs" onclick="saveCharacterId(${q(name)})">${t('btn_save')}</button><button class="btn-ghost xs" onclick="resetCharacterId(${q(name)})">${t('char_id_new')}</button><button class="btn-ghost xs danger" onclick="adminDeleteHero(${q(name)})">${t('del_title')}</button></div></td>
        </tr>`;
      }).join('');
      return `<div class="settings-section">
        <div>
          <div class="settings-label">${t('admin_controls')}</div>
          <div class="settings-sub">${t('admin_controls_sub')}</div>
        </div>
        <div class="admin-box">
          <div class="field"><label>${t('admin_url')}</label><input class="field-input" value="${h(link)}" readonly></div>
          <div class="admin-actions"><button class="btn-ghost xs" onclick="copyAdminLink()">🔗 ${t('btn_share')}</button><button class="btn-ghost xs" onclick="lockAdmin()">${t('admin_lock')}</button></div>
          <table class="admin-table"><thead><tr><th>${t('hero_name_short')}</th><th>${t('character_id')}</th><th>${t('xp')}</th><th>${t('pick_class')}</th><th>${t('admin_actions')}</th></tr></thead><tbody>${rows || `<tr><td colspan="5">${t('no_participants')}</td></tr>`}</tbody></table>
        </div>
      </div>`;
    }
    function renderOverlay() {
      const root = document.getElementById('app-overlays');
      if (!root) return;
      if (!_overlay) { root.innerHTML = ''; return; }
      if (_overlay === 'onboarding') {
        root.innerHTML = `<div class="picker-overlay"><div class="picker" onclick="event.stopPropagation()">
          <div class="victory-card" style="width:100%;box-shadow:none;border:0;background:transparent;padding:14px 8px 8px">
            <div class="vc-crown">⚔️</div>
            <div class="vc-title">${t('onboarding_title')}</div>
            <div class="vc-sub">${t('onboarding_sub')}</div>
            <button class="btn-gold" style="width:100%;margin-top:18px" onclick="startOnboarding()">＋ ${t('onboarding_start')}</button>
            <button class="btn-ghost" style="width:100%;margin-top:10px" onclick="_overlay='settings';renderOverlay()">⚙ ${t('admin_setup')}</button>
          </div>
        </div></div>`;
        return;
      }
      if (_overlay === 'board') {
        syncActiveCampaign();
        const campaigns = (S.campaigns || []).slice();
        root.innerHTML = `<div class="picker-overlay" onclick="closeOverlay()"><div class="picker modal-wide" onclick="event.stopPropagation()">
          <div class="picker-head"><div><div class="picker-title">🗺️ ${t('quest_board')}</div><div class="picker-sub">${t('quest_board_sub')}</div></div><button class="picker-close" onclick="closeOverlay()">✕</button></div>
          <div class="board-grid">${campaigns.map(c => {
            const total = (c.expenses || []).reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
            const active = c.id === S.activeCampaignId;
            const status = active ? t('active_quest') : c.completedAt ? t('completed_quest') : t('saved_quest');
            return `<div class="board-card ${active ? 'active' : ''}">
              <div><div class="board-title">${h(c.tripName || t('trip_fallback_name'))}</div><div class="board-meta">${status} · ${(c.participants || []).length} ${t('party')} · ${(c.expenses || []).length} ${t('quest_count')} · ${money(total)}</div></div>
              <div class="board-actions">
                ${active ? `<button class="btn-ghost xs" onclick="completeCampaign()">🏁 ${t('complete_quest')}</button>` : `<button class="btn-primary sm" onclick="openCampaign('${c.id}')">${t('open_quest')}</button>`}
                ${campaigns.length > 1 ? `<button class="btn-ghost xs danger" onclick="deleteCampaign('${c.id}')">${t('del_title')}</button>` : ''}
              </div>
            </div>`;
          }).join('')}</div>
          <hr class="modal-divider">
          <div class="import-actions"><button class="btn-ghost" onclick="closeOverlay()">${t('btn_cancel')}</button><button class="btn-primary" onclick="createCampaign()">＋ ${t('start_campaign')}</button></div>
        </div></div>`;
        return;
      }
      if (_overlay === 'receipt') {
        root.innerHTML = `<div class="picker-overlay" onclick="closeOverlay()"><div onclick="event.stopPropagation()">
          <button class="picker-close" style="position:fixed;right:22px;top:22px" onclick="closeOverlay()">✕</button>
          <img class="lightbox-img" src="${_receiptView || ''}" alt="${h(t('receipt'))}">
        </div></div>`;
        return;
      }
      if (_overlay === 'tribute' && _tributeTx) {
        const pp = S.promptpay?.[_tributeTx.to] || '';
        const ok = validPromptPay(pp);
        const payload = ok ? promptPayPayload(pp, Number(_tributeTx.amount) || 0) : '';
        root.innerHTML = `<div class="picker-overlay" onclick="closeOverlay()"><div class="picker" onclick="event.stopPropagation()">
          <div class="picker-head"><div><div class="picker-title">💸 ${t('send_tribute')}</div><div class="picker-sub">${h(_tributeTx.from)} → ${h(_tributeTx.to)} · ${money2(_tributeTx.amount)}</div></div><button class="picker-close" onclick="closeOverlay()">✕</button></div>
          <div class="tribute-summary">${heroAvatar(_tributeTx.from, 42)}<span>${money2(_tributeTx.amount)}</span><span>⮕</span>${heroAvatar(_tributeTx.to, 42)}<strong>${h(_tributeTx.to)}</strong></div>
          ${!ok || _tributeEdit ? `<div class="pp-form">
            <div class="settings-sub">${t('promptpay_missing')}</div>
            <div class="field"><label>${t('promptpay')}</label><input id="promptpay-input" class="field-input" inputmode="numeric" value="${h(pp)}" placeholder="${h(t('promptpay_placeholder'))}" onkeydown="if(event.key==='Enter')savePromptPay(${q(_tributeTx.to)})"></div>
            <button class="btn-primary" onclick="savePromptPay(${q(_tributeTx.to)})">${t('save_promptpay')}</button>
          </div>` : `<div class="qr-paybox">
            <div class="settings-sub">${t('scan_to_pay')} · ${fmtPP(pp)}</div>
            ${qrSvg(payload, 260)}
            <div class="import-actions" style="width:100%"><button class="btn-ghost" onclick="_tributeEdit=true;renderOverlay()">${t('edit_promptpay')}</button><button class="btn-primary" onclick="confirmTributePaid()">✓ ${t('confirm_paid')}</button></div>
          </div>`}
        </div></div>`;
        return;
      }
      if (_overlay === 'templates') {
        root.innerHTML = `<div class="picker-overlay" onclick="closeOverlay()"><div class="picker modal-wide" onclick="event.stopPropagation()">
          <div class="picker-head"><div><div class="picker-title">📋 ${t('pick_template')}</div></div><button class="picker-close" onclick="closeOverlay()">✕</button></div>
          <div class="tmpl-grid">${QUEST_TEMPLATES.map(tp => {
            const total = tp.items.reduce((sum, item) => sum + item[3], 0);
            return `<div class="tmpl-card"><div class="tmpl-top"><span class="tmpl-icon">${tp.icon}</span><div><div class="tmpl-name">${h(tp[LANG] || tp.th)}</div><div class="tmpl-meta">${tp.items.length} ${LANG === 'en' ? 'quests' : 'เควส'} · ${money(total)}</div></div></div>
              <div class="tmpl-items">${tp.items.map(item => `<div class="tmpl-item"><span>${item[0]} ${h(LANG === 'en' ? item[2] : item[1])}</span><span>${money(item[3])}</span></div>`).join('')}</div>
              <button class="btn-primary sm" onclick="useTemplate('${tp.id}')">＋ ${t('use_template')}</button></div>`;
          }).join('')}</div>
          <hr class="modal-divider"><button class="btn-ghost" onclick="downloadTemplate()">📥 ${t('download_excel_template')}</button>
        </div></div>`;
        return;
      }
      if (_overlay === 'import') {
        root.innerHTML = `<div class="picker-overlay" onclick="closeOverlay()"><div class="picker" onclick="event.stopPropagation()">
          <div class="picker-head"><div><div class="picker-title">📥 ${t('import_scroll')}</div><div class="picker-sub">${t('import_scroll_hint')}</div></div><button class="picker-close" onclick="closeOverlay()">✕</button></div>
          <textarea id="import-text" class="import-area" placeholder="${h(t('import_scroll_placeholder'))}" oninput="updateImportCount()"></textarea>
          <div id="import-count" class="import-count">${t('import_parsed_count', { n: 0 })}</div>
          <div class="import-actions"><button class="btn-ghost" onclick="closeOverlay();triggerImport()">📊 ${t('import_excel_btn')}</button><button class="btn-primary" onclick="importTextItems()">📥 ${t('import_text_btn')}</button></div>
        </div></div>`;
        return;
      }
      if (_overlay === 'settings') {
        root.innerHTML = `<div class="picker-overlay" onclick="closeOverlay()"><div class="picker" onclick="event.stopPropagation()">
          <div class="picker-head"><div class="picker-title">⚙ ${t('settings')}</div><button class="picker-close" onclick="closeOverlay()">✕</button></div>
          <div class="settings-grid">
            <div class="settings-row"><div><div class="settings-label">${t('theme')}</div></div><div class="setting-seg"><button class="${S.settings.theme === 'tavern' ? 'on' : ''}" onclick="setTheme('tavern')">${t('theme_tavern')}</button><button class="${S.settings.theme === 'dungeon' ? 'on' : ''}" onclick="setTheme('dungeon')">${t('theme_dungeon')}</button></div></div>
            <div class="settings-row"><div class="settings-label">${t('accent')}</div><div class="swatches">${ACCENTS.map(color => `<button class="swatch ${S.settings.accent === color ? 'on' : ''}" style="background:${color}" onclick="setAccent('${color}')" aria-label="${color}"></button>`).join('')}</div></div>
            <div class="settings-row"><div><div class="settings-label">${t('game_stats')}</div><div class="settings-sub">HP / LVL / XP</div></div><button class="switch ${S.settings.stats ? 'on' : ''}" onclick="toggleSetting('stats')" aria-pressed="${S.settings.stats}"></button></div>
            <div class="settings-row"><div class="settings-label">${t('sound_effects')}</div><button class="switch ${S.settings.sound ? 'on' : ''}" onclick="toggleSetting('sound')" aria-pressed="${S.settings.sound}"></button></div>
            <div class="settings-row"><div class="settings-label">${t('animations')}</div><button class="switch ${S.settings.animations !== false ? 'on' : ''}" onclick="toggleSetting('animations')" aria-pressed="${S.settings.animations !== false}"></button></div>
            ${renderAdminPanel()}
          </div>
        </div></div>`;
        return;
      }
      if (_overlay === 'victory') {
        const party = computeParty();
        const mvp = party.slice().sort((a,b) => b.gen - a.gen)[0];
        const settler = party.slice().sort((a,b) => (Number(S.settleXp[b.name])||0) - (Number(S.settleXp[a.name])||0))[0];
        const total = S.expenses.reduce((sum,e) => sum + e.amount, 0);
        const colors = ['var(--gold)','var(--accent)','var(--hp)','#6d5ae0','#2a7fb8','#ffe79c'];
        root.innerHTML = `<div class="victory-overlay" onclick="closeOverlay()"><div class="confetti">${Array.from({length:18},(_,i) => `<i style="left:${5+i*5.2}%;background:${colors[i%colors.length]};animation-delay:${(i%9)*.12}s"></i>`).join('')}</div>
          <div class="victory-card" onclick="event.stopPropagation()"><div class="vc-crown">🏆</div><div class="vc-title">${t('quest_complete')}</div><div class="vc-sub">${t('quest_complete_sub')}</div>
          <div class="vc-recap"><div class="vc-stat"><strong>${money(total)}</strong><span>${t('total_spent')}</span></div><div class="vc-stat"><strong>${S.expenses.length}</strong><span>${t('quest_count')}</span></div><div class="vc-stat"><strong>${party.length}</strong><span>${t('party')}</span></div></div>
          <div class="vc-awards">${mvp?.gen > 0 ? `<div class="vc-award"><span style="font-size:26px">🥇</span>${heroAvatar(mvp.name,46)}<div><strong>${h(mvp.name)}</strong><small>${t('most_generous')} · ${t('fronted')} ${money(mvp.gen)}</small></div></div>` : ''}
          ${settler && Number(S.settleXp[settler.name]) > 0 && settler.name !== mvp?.name ? `<div class="vc-award"><span style="font-size:26px">🤝</span>${heroAvatar(settler.name,46)}<div><strong>${h(settler.name)}</strong><small>${t('top_settler')}</small></div></div>` : ''}</div>
          <button class="btn-gold" style="width:100%" onclick="closeOverlay()">⚔️ ${t('view_party')}</button></div></div>`;
      }
    }
    function renderAll(checkLevels = true) {
      ensureAllCharacterIds();
      const party = computeParty();
      syncCharacterRegistry(party);
      if (checkLevels) detectLevelUps(party);
      renderTripName();
      renderParty();
      renderEntry();
      renderLog(party);
      renderSettlement(party);
      const outstanding = settleUp(party).filter(tx => !_settledTx.includes(tx.from + '>' + tx.to)).length;
      if (_prevOutstanding !== null && _prevOutstanding > 0 && outstanding === 0 && S.expenses.length) {
        syncActiveCampaign({ completedAt: Date.now() });
        _overlay = 'victory'; SFX.win(); save();
      }
      _prevOutstanding = outstanding;
      renderOverlay();
      translatePage();
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    async function saveWorkbook(wb, filename) {
      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function xlHeaderRow(row, bgArgb) {
      row.height = 22;
      row.eachCell({ includeEmpty: true }, cell => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 10, name: 'Calibri' };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bgArgb || 'FF2f8f5b' } };
        cell.alignment = { vertical: 'middle' };
        cell.border = { bottom: { style: 'thin', color: { argb: 'FF1f6b41' } } };
      });
    }
    function xlDataRow(row, isAlt) {
      row.height = 18;
      if (isAlt) row.eachCell({ includeEmpty: true }, cell => {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF3E9D4' } };
      });
    }
    function cellStr(v) {
      if (v === null || v === undefined) return '';
      if (typeof v === 'object') return String(v.result ?? v.text ?? '');
      return String(v);
    }
    async function exportExcel() {
      if (!S.expenses.length) { toast(t('err_no_data')); return; }
      const total = S.expenses.reduce((s, e) => s + e.amount, 0);
      const wb = new ExcelJS.Workbook();
      wb.creator = 'Party Ledger';
      const ws1 = wb.addWorksheet('Quest Log');
      [34,14,18,42].forEach((w,i) => ws1.getColumn(i + 1).width = w);
      ws1.views = [{ state: 'frozen', ySplit: 1 }];
      xlHeaderRow(ws1.addRow(['Quest', 'Gold (฿)', 'Paid By', 'Split With']));
      S.expenses.forEach((e, i) => {
        const payers = payerMap(e);
        const payerText = Object.keys(payers).length > 1
          ? Object.entries(payers).map(([name, amount]) => `${name}: ${amount.toFixed(2)}`).join('; ')
          : (Object.keys(payers)[0] || e.paidBy);
        const shares = splitShares(e);
        const splitText = (e.split?.mode || 'equal') === 'equal'
          ? e.sharedBy.join(', ')
          : Object.entries(shares).map(([name, amount]) => `${name}: ${amount.toFixed(2)}`).join('; ');
        const row = ws1.addRow([e.desc, e.amount, payerText, splitText]);
        row.getCell(2).numFmt = '#,##0.00';
        row.getCell(2).alignment = { horizontal: 'right' };
        xlDataRow(row, i % 2 === 1);
      });
      ws1.addRow([]);
      const totRow = ws1.addRow(['Total', total]);
      totRow.getCell(1).font = { bold: true };
      totRow.getCell(2).font = { bold: true };
      totRow.getCell(2).numFmt = '#,##0.00';
      const party = computeParty();
      const txns = settleUp(party);
      const ws2 = wb.addWorksheet('Balance the Party');
      [22,22,16].forEach((w,i) => ws2.getColumn(i + 1).width = w);
      ws2.mergeCells('A1:C1');
      ws2.getCell('A1').value = `Party Ledger: ${S.tripName}`;
      ws2.getCell('A1').font = { bold: true, size: 14, color: { argb: 'FF2f8f5b' } };
      ws2.getCell('A1').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFefe0b6' } };
      ws2.addRow([]); xlHeaderRow(ws2.addRow(['Hero', 'Balance (฿)', 'Status']));
      party.forEach((p, i) => {
        const row = ws2.addRow([p.name, Math.abs(p.bal), p.bal > .5 ? 'Guardian' : p.bal < -.5 ? 'In Debt' : 'Even']);
        row.getCell(2).numFmt = '#,##0.00';
        row.getCell(2).alignment = { horizontal: 'right' };
        xlDataRow(row, i % 2 === 1);
      });
      ws2.addRow([]); xlHeaderRow(ws2.addRow(['From', 'To', 'Gold (฿)']));
      txns.forEach((tx, i) => {
        const row = ws2.addRow([tx.from, tx.to, tx.amount]);
        row.getCell(3).numFmt = '#,##0.00';
        row.getCell(3).alignment = { horizontal: 'right' };
        xlDataRow(row, i % 2 === 1);
      });
      await saveWorkbook(wb, `${S.tripName || 'party-ledger'}.xlsx`);
    }
    async function downloadTemplate() {
      const wb = new ExcelJS.Workbook();
      wb.creator = 'Party Ledger';
      const ws1 = wb.addWorksheet('Instructions');
      [18,54,16,42].forEach((w,i) => ws1.getColumn(i + 1).width = w);
      ws1.mergeCells('A1:D1');
      ws1.getCell('A1').value = 'Party Ledger — Import Template';
      ws1.getCell('A1').font = { bold: true, size: 16, color: { argb: 'FF2f8f5b' } };
      ws1.getCell('A1').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFefe0b6' } };
      ws1.addRow([]); xlHeaderRow(ws1.addRow(['Description', 'Amount (฿)', 'Paid By', 'Split With']));
      [['Dinner',900,'Shane','Shane, Pointy, Arm'],['Gas',500,'Pointy','Shane, Pointy'],['Hotel',3000,'Arm','Shane, Pointy, Arm']].forEach((data, i) => {
        const row = ws1.addRow(data); row.getCell(2).numFmt = '#,##0.00'; xlDataRow(row, i % 2 === 1);
      });
      const ws2 = wb.addWorksheet('Expenses');
      [34,14,18,42].forEach((w,i) => ws2.getColumn(i + 1).width = w);
      ws2.views = [{ state: 'frozen', ySplit: 1 }];
      xlHeaderRow(ws2.addRow(['Description', 'Amount (฿)', 'Paid By', 'Split With']));
      for (let i = 0; i < 20; i++) {
        const row = ws2.addRow(['', null, '', '']);
        row.getCell(2).numFmt = '#,##0.00';
        xlDataRow(row, i % 2 === 1);
      }
      await saveWorkbook(wb, 'party-ledger-template.xlsx');
    }
    function triggerImport() {
      document.getElementById('import-input').value = '';
      document.getElementById('import-input').click();
    }
    async function importExcel(input) {
      const file = input.files[0];
      if (!file) return;
      try {
        const buffer = await file.arrayBuffer();
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(buffer);
        const ws = wb.worksheets.length > 1 ? wb.worksheets[1] : wb.worksheets[0];
        let imported = 0, firstRow = true;
        ws.eachRow({ includeEmpty: false }, row => {
          if (firstRow) { firstRow = false; return; }
          const v = row.values;
          const desc = cellStr(v[1]).trim();
          const amtNum = parseFloat(cellStr(v[2]));
          const payer = cellStr(v[3]).trim();
          const split = cellStr(v[4]);
          if (!desc || !amtNum || amtNum <= 0 || !payer) return;
          const sharers = split ? split.split(',').map(s => s.trim()).filter(Boolean) : [payer];
          if (!S.participants.includes(payer)) S.participants.push(payer);
          sharers.forEach(p => { if (p && !S.participants.includes(p)) S.participants.push(p); });
          const icon = QUEST_ICONS[hashOf(desc) % QUEST_ICONS.length];
          S.expenses.push({ id: Date.now() + Math.random(), desc, icon, amount: amtNum, paidBy: payer, sharedBy: sharers });
          imported++;
        });
        if (!imported) { toast(t('err_import_empty')); return; }
        _settledTx = [];
        save(); renderAll();
        toast(t('toast_imported', { n: imported }));
      } catch (err) {
        console.error('Import failed', err);
        toast(t('err_import_format'));
      }
    }

    translatePage();
    renderAll(false);
    load().then(() => { renderAll(false); translatePage(); });
  </script>
